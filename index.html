<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVM Planner"><title>AVM Planner</title><style>html,body{margin:0;height:100%;background:#f7f5ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{text-align:center;padding:48px 20px}</style></head><body><div id="boot">در حال بارگذاری پلنر AVM…</div><script>(async()=>{try{try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}const r=await fetch('./app.html?build=20260823-v4',{cache:'no-store'});if(!r.ok)throw Error('planner '+r.status);const t=await r.text();document.open();document.write(t);document.close()}catch(e){document.getElementById('boot').textContent='AVM Planner could not load.'}})()</script></body></html>
