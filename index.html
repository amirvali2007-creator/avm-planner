<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="پلنر تحصیلی AVM"><link rel="manifest" href="./manifest.webmanifest"><title>پلنر تحصیلی AVM</title><style>html,body{margin:0;background:#f8fafc;color:#334155}#boot{text-align:center;padding:48px 20px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style></head><body><div id="boot">در حال بارگذاری پلنر تحصیلی AVM…</div><script>
(async()=>{
try{
 const defaults=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'];
 const keys=['avm_original_subjects_v1','avm_planner_subjects_data_v2'];
 try{let all=[...defaults]; for(const k of keys){const x=JSON.parse(localStorage.getItem(k)||'null'); if(Array.isArray(x)) for(const s of x) if(s&&typeof s==='string'&&!all.includes(s)) all.push(s)} for(const k of keys)localStorage.setItem(k,JSON.stringify(all));}catch(_){ }
 if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
 if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
 const parts=await Promise.all([1,2,3,4].map(i=>fetch('./planner-parts/'+i+'.txt?build=20260823-final',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('asset '+i+' '+r.status);return r.text()})));
 const s=parts.join('').trim(),bin=atob(s),u8=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(!('DecompressionStream'in window))throw Error('browser gzip support unavailable');
 const out=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 if(!out.includes('پلنر تحصیلی AVM')||!out.includes('planner-table-body')||!out.includes('openEditSessionModal'))throw Error('planner integrity check failed');
 const patch=`<script>(function(){
 const DEF=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'];
 const KEYS=['avm_original_subjects_v1','avm_planner_subjects_data_v2'];
 function merge(){try{let a=[...DEF];for(const k of KEYS){const x=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(x))for(const s of x)if(typeof s==='string'&&s&&!a.includes(s))a.push(s)}if(Array.isArray(window.subjects)){for(const s of window.subjects)if(typeof s==='string'&&s&&!a.includes(s))a.push(s);window.subjects=a}for(const k of KEYS)localStorage.setItem(k,JSON.stringify(a));return a}catch(e){return DEF}}
 function makeEditable(){
   merge();
   document.querySelectorAll('#planner-table-body input,#planner-table-body select,#planner-table-body textarea').forEach(e=>{e.disabled=false;e.readOnly=false;e.style.pointerEvents='auto';e.removeAttribute('disabled');e.removeAttribute('readonly')});
   if(typeof populateSubjectFilterDropdown==='function')populateSubjectFilterDropdown();
   if(typeof populateModalSubjectsDropdown==='function')populateModalSubjectsDropdown();
 }
 function addMonthlyEditors(){
   const grid=document.getElementById('monthly-calendar-grid'); if(!grid)return;
   grid.querySelectorAll('button[onclick*="quickAddSession"]').forEach(btn=>{
     const m=(btn.getAttribute('onclick')||'').match(/quickAddSession\('([^']+)'\)/); if(!m)return; const date=m[1],cell=btn.closest('div.min-h-\\[120px\\]')||btn.parentElement?.parentElement; if(!cell||cell.querySelector('.avm-month-note'))return;
     const ta=document.createElement('textarea'); ta.className='avm-month-note w-full min-h-[55px] resize-y bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-[9px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500'; ta.placeholder='برنامه این روز را بنویس...'; ta.value=JSON.parse(localStorage.getItem('avm_original_month_notes_v1')||'{}')[date]||'';
     ta.addEventListener('input',()=>{try{const n=JSON.parse(localStorage.getItem('avm_original_month_notes_v1')||'{}');n[date]=ta.value;localStorage.setItem('avm_original_month_notes_v1',JSON.stringify(n))}catch(e){}}); cell.insertBefore(ta,cell.lastElementChild); 
   });
 }
 function install(){
   merge();
   if(typeof window.__avmPatchedRender==='undefined'&&typeof renderTable==='function'){window.__avmPatchedRender=renderTable;window.renderTable=function(){window.__avmPatchedRender();makeEditable()}}
   if(typeof window.__avmPatchedOpen==='undefined'&&typeof openEditSessionModal==='function'){window.__avmPatchedOpen=openEditSessionModal;window.openEditSessionModal=function(){merge();if(typeof populateModalSubjectsDropdown==='function')populateModalSubjectsDropdown();return window.__avmPatchedOpen.apply(this,arguments)}}
   if(typeof window.__avmPatchedMonth==='undefined'&&typeof renderMonthlyCalendar==='function'){window.__avmPatchedMonth=renderMonthlyCalendar;window.renderMonthlyCalendar=function(){window.__avmPatchedMonth();addMonthlyEditors()}}
   makeEditable(); if(typeof renderTable==='function')renderTable(); if(typeof renderMonthlyCalendar==='function')renderMonthlyCalendar(); else addMonthlyEditors();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(install,0)); else setTimeout(install,0); setTimeout(install,700); setTimeout(install,1800);
})();</script>`;
 document.open();document.write(out.replace('</body>',patch+'</body>'));document.close();
}catch(e){document.getElementById('boot').innerHTML='AVM Planner could not load. Please refresh once.'}
})();</script></body></html>
