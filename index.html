<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D3D2D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AVM Planner"><link rel="manifest" href="./manifest.webmanifest"><title>AVM Planner</title><style>body{margin:0;background:#F7F5EF;color:#0D3D2D;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{text-align:center;padding:48px 20px}</style></head><body><div id="boot">در حال بارگذاری AVM Planner…</div><script>
(async()=>{try{
  const parts=await Promise.all([1,2,3,4].map(i=>fetch('./planner-parts/'+i+'.txt?build=20260823-editable-v2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset '+i+' '+r.status);return r.text()})));
  const s=parts.join('').trim(),bin=atob(s),u8=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window))throw new Error('browser gzip support unavailable');
  let out=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(!out.includes('planner-table-body')||!out.includes('openEditSessionModal')||!out.includes('renderMonthlyCalendar'))throw new Error('planner integrity check failed');
  out=out.replace('<script type="module">','<script>');
  out=out.replace(/\s*import \{ initializeApp \} from "https:\/\/www\.gstatic\.com\/firebase\/11\.6\.1\/firebase-app\.js";\s*/,'');
  out=out.replace(/\s*import \{ getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged \} from "https:\/\/www\.gstatic\.com\/firebase\/11\.6\.1\/firebase-auth\.js";\s*/,'');
  out=out.replace(/\s*import \{ getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot \} from "https:\/\/www\.gstatic\.com\/firebase\/11\.6\.1\/firebase-firestore\.js";\s*/,'');
  const monthlyPatch=`<script>(function(){function install(){const grid=document.getElementById('monthly-calendar-grid');if(!grid)return;grid.querySelectorAll('[data-avm-month-note]').forEach(n=>n.remove());grid.querySelectorAll('button[onclick^="quickAddSession"]').forEach(btn=>{const m=(btn.getAttribute('onclick')||'').match(/quickAddSession\\('([^']+)'/);if(!m)return;const date=m[1],cell=btn.closest('div.min-h-\\[120px\\]')||btn.parentElement?.parentElement;if(!cell||cell.querySelector('[data-avm-month-note]'))return;const ta=document.createElement('textarea');ta.setAttribute('data-avm-month-note','1');ta.placeholder='برنامه این روز را بنویس...';ta.className='w-full min-h-[48px] resize-y bg-white/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-[9px] text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400';let notes={};try{notes=JSON.parse(localStorage.getItem('avm_planner_monthly_notes_v1')||'{}')}catch(_){}ta.value=notes[date]||'';ta.addEventListener('input',()=>{try{const n=JSON.parse(localStorage.getItem('avm_planner_monthly_notes_v1')||'{}');n[date]=ta.value;localStorage.setItem('avm_planner_monthly_notes_v1',JSON.stringify(n))}catch(_){}});cell.insertBefore(ta,cell.children[1]||null)});}
const old=window.renderMonthlyCalendar; if(typeof old==='function'&&!window.__avmMonthlyWrapped){window.__avmMonthlyWrapped=true;window.renderMonthlyCalendar=function(){old.apply(this,arguments);install()}};setTimeout(install,50);setTimeout(install,500);setTimeout(install,1500)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install()})();<\\/script>`;
  out=out.replace('</body>',monthlyPatch+'</body>');
  document.open();document.write(out);document.close();
}catch(e){document.getElementById('boot').innerHTML='AVM Planner could not load.<br><small>'+String(e.message||e)+'</small>'}})();
</script></body></html>
