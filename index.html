    <style>
    :root{--bg:#f7f5ef;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--ind:#4f46e5;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--ind);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 20px #4f46e528}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px}.primary,.soft,.delete{border:0;border-radius:12px;padding:9px 14px;font-size:12px;cursor:pointer}.primary{background:var(--ind);color:#fff}.soft{background:#f3f4f6;color:#374151;border:1px solid var(--border)}main{max-width:1400px;margin:auto;padding:22px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpis>div,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 6px 25px #00000008}.kpis>div{padding:15px}.kpis span,.kpis small{display:block;color:var(--muted);font-size:11px}.kpis b{display:block;font-size:24px;margin:4px 0}.card{padding:16px;margin-bottom:18px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.cardhead h2{margin:0;font-size:14px}.cardhead p{margin:4px 0 0;color:var(--muted);font-size:10px}.cardhead>div{display:flex;align-items:center;gap:8px}.cardhead select,.cardhead input{border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff;font-size:11px}.tablewrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px}th,td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:right}th{font-size:11px;color:var(--muted);background:#f8fafc;position:sticky;top:0}.inline-input,.inline,.inlineSel,.time,.topic{width:100%;padding:7px 8px;border:1px solid transparent;background:transparent;border-radius:9px;font-size:11px;min-width:80px}.inline-input:hover,.inline-input:focus,.inline:hover,.inline:focus,.inlineSel:hover,.inlineSel:focus,.time:hover,.time:focus,.topic:hover,.topic:focus{border-color:#c7d2fe;background:#f8faff;outline:none}.inlineSel{min-width:135px}.time{width:90px}.topic{min-width:220px}.delete{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.daycard{border:1px solid var(--border);border-radius:14px;padding:10px;min-height:210px;background:#fafafa}.dayhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:8px}.dayhead span{display:block;color:var(--muted);font-size:10px}.dayhead button{border:0;background:var(--ind);color:#fff;border-radius:8px;padding:5px 8px;cursor:pointer}.sessionbtn{width:100%;text-align:right;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px;margin-bottom:7px;cursor:pointer}.sessionbtn b,.sessionbtn span,.sessionbtn small{display:block}.sessionbtn span{font-size:10px;color:var(--muted);margin-top:3px}.sessionbtn small{font-size:10px;margin-top:3px}.monthheads,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.monthheads>div{text-align:center;background:#f3f4f6;border-radius:8px;padding:8px;font-size:11px;color:var(--muted);font-weight:700}.monthday{min-height:210px;border:1px solid var(--border);border-radius:12px;background:#fafafa;padding:8px;display:flex;flex-direction:column;gap:6px}.monthdayhead{display:flex;justify-content:space-between;align-items:center}.monthdayhead button{border:0;background:var(--ind);color:#fff;border-radius:8px;padding:4px 7px;cursor:pointer}.monthday textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--border);border-radius:9px;padding:7px;font-size:10px;background:#fff}.minisession{width:100%;border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px;text-align:right;cursor:pointer}.minisession span,.minisession small{display:block}.minisession small{font-size:9px;color:var(--muted);margin-top:2px}.tag{font-size:11px;font-weight:700;background:#f3f4f6;border:1px solid var(--border);padding:8px 12px;border-radius:10px}.overlay{position:fixed;inset:0;z-index:100;background:#111827aa;display:grid;place-items:center;padding:16px}.modal{width:min(640px,100%);background:#fff;border-radius:18px;box-shadow:0 30px 80px #0005;overflow:hidden}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);background:#f8fafc}.modalhead h3{margin:0;font-size:14px}.modalhead button{border:0;background:transparent;font-size:22px;color:#6b7280;cursor:pointer}.form{padding:16px;display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:11px;font-weight:700}.form input,.form select,.form textarea{border:1px solid var(--border);border-radius:10px;padding:9px;font-size:11px;background:#fff}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .buttons{display:flex;justify-content:space-between;gap:8px;align-items:center}.form .buttons>div{display:flex;gap:8px}.secondary{border:0;background:#f3f4f6;color:#374151;border-radius:10px;padding:9px 14px;cursor:pointer}.danger{border:0;background:#fff1f2;color:#e11d48;border-radius:10px;padding:9px 14px;cursor:pointer}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr 1fr}.monthheads,.month{gap:4px}.monthday{min-height:180px}}@media(max-width:640px){main{padding:12px}.top{padding:10px 12px}.brand p{display:none}.actions{gap:5px}.week{grid-template-columns:1fr}.monthheads,.month{grid-template-columns:repeat(2,1fr)}.monthheads>div:nth-child(n+3){display:none}.monthday{min-height:190px}.cardhead{flex-direction:column;align-items:stretch}}

<body><div id="root"></div>
<script>
'use strict';
const SKEY='avm_planner_sessions_v9',SUBKEY='avm_planner_subjects_v9',NKEY='avm_planner_notes_v9';
const STATUS=['برنامه‌ریزی شده','در حال مطالعه','خوانده شده','خوانده نشده'];
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
let subjects=load(SUBKEY,['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح']);
let sessions=load(SKEY,[]), notes=load(NKEY,{}), monthOffset=0, weekOffset=0;
function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}
function save(){localStorage.setItem(SKEY,JSON.stringify(sessions));localStorage.setItem(SUBKEY,JSON.stringify(subjects));localStorage.setItem(NKEY,JSON.stringify(notes))}
function fa(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const gy2=gm>2?gy+1:gy;let d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;jy+=Math.floor((d-1)/365);if(d>0)d=(d-1)%365;const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy-=979;let d=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd;d+=(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=1600+400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const md=[0,31,28,31,30,31,30,31,31,30,31,30,31];md[2]=(gy%4===0&&gy%100!==0)||gy%400===0?29:28;let gm=1;while(gm<=12&&gd>md[gm]){gd-=md[gm];gm++}return `${gy}-${pad(gm)}-${pad(gd)}`}
function today(){return new Date().toISOString().slice(0,10)}
function jfmt(ds){const [y,m,d]=ds.split('-').map(Number),[jy,jm,jd]=g2j(y,m,d);return `${fa(jy)}/${fa(pad(jm))}/${fa(pad(jd))}`}
function sc(s){return {'تغذیه':'#10b981','فیزیولوژی':'#0284c7','بیوشیمی':'#8b5cf6','زبان':'#f59e0b','استراحت / تفریح':'#f43f5e'}[s]||'#6366f1'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mins(a,b){if(!a||!b)return 0;const x=a.split(':').map(Number),y=b.split(':').map(Number),m=y[0]*60+y[1]-x[0]*60-x[1];return Math.max(0,m)}
function mount(){document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">🎓</div><div><h1>پلنر تحصیلی AVM</h1><p>برنامه‌ریزی، ویرایش و ذخیره‌سازی دائمی</p></div></div><div class="actions"><button id="manage" class="soft">مدیریت دروس</button><button id="add" class="primary">＋ برنامه جدید</button></div></header><main><section class="kpis"><div><span>کل برنامه‌ها</span><b id="kt">۰</b><small>جلسه</small></div><div><span>ساعات مطالعه</span><b id="kh">۰</b><small>ساعت</small></div><div><span>برنامه امروز</span><b id="kd">۰</b><small>جلسه</small></div><div><span>باقی‌مانده</span><b id="kp">۰</b><small>جلسه</small></div></section><section class="card"><div class="cardhead"><h2>جدول اصلی برنامه مطالعه — همه ستون‌های اصلی قابل ویرایش</h2><div><select id="filter"></select><input id="search" placeholder="جستجو..."></div></div><div class="tablewrap"><table><thead><tr><th>انجام</th><th>درس</th><th>تاریخ</th><th>از</th><th>تا</th><th>وضعیت</th><th>مبحث / فصل</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="card"><div class="cardhead"><h2>تقویم هفتگی</h2><div><button id="wp" class="soft">هفته قبل</button><span id="wt" class="tag"></span><button id="wn" class="soft">هفته بعد</button></div></div><div id="week" class="week"></div></section><section class="card"><div class="cardhead"><div><h2>برنامه ماهانه — ویرایش مستقیم هر روز</h2><p>در هر خانه متن برنامه همان روز را بنویس؛ این متن جداگانه ذخیره می‌شود و جلسات همان روز هم قابل ویرایش‌اند.</p></div><div><button id="mp" class="soft">ماه قبل</button><span id="mt" class="tag"></span><button id="mn" class="soft">ماه بعد</button></div></div><div class="monthheads">${DAYS.map(d=>`<div>${d}</div>`).join('')}</div><div id="month" class="month"></div></section></main></div>`;document.getElementById('add').onclick=()=>editor();document.getElementById('manage').onclick=manageSubjects;document.getElementById('filter').onchange=renderTable;document.getElementById('search').oninput=renderTable;document.getElementById('wp').onclick=()=>{weekOffset--;renderWeek()};document.getElementById('wn').onclick=()=>{weekOffset++;renderWeek()};document.getElementById('mp').onclick=()=>{monthOffset--;renderMonth()};document.getElementById('mn').onclick=()=>{monthOffset++;renderMonth()};renderAll()}
function renderAll(){renderFilter();renderTable();renderWeek();renderMonth();metrics()}
function renderFilter(){const el=document.getElementById('filter'),v=el.value;el.innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(subjects.includes(v))el.value=v}
function renderTable(){const body=document.getElementById('tbody'),f=document.getElementById('filter').value,q=document.getElementById('search').value.trim().toLowerCase();const list=sessions.filter(s=>(!f||s.subject===f)&&`${s.subject} ${s.topic||''}`.toLowerCase().includes(q)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.startTime||'').localeCompare(b.startTime||''));body.innerHTML='';for(const s of list){const tr=document.createElement('tr');tr.innerHTML=`<td><input type="checkbox" ${s.completed?'checked':''}></td><td><select class="inlineSel"></select></td><td><input class="inline" type="date"></td><td><input class="time" type="time"></td><td><input class="time" type="time"></td><td><select class="inlineSel status"></select></td><td><input class="topic" type="text"></td><td><button class="delete">حذف</button></td>`;const done=tr.children[0].firstChild,sub=tr.children[1].firstChild,date=tr.children[2].firstChild,start=tr.children[3].firstChild,end=tr.children[4].firstChild,status=tr.children[5].firstChild,topic=tr.children[6].firstChild;subjects.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;if(x===s.subject)o.selected=true;sub.appendChild(o)});STATUS.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;if(x===s.status)o.selected=true;status.appendChild(o)});date.value=s.date||today();start.value=s.startTime||'09:00';end.value=s.endTime||'11:00';topic.value=s.topic||'';const sync=(field,val)=>{s[field]=val;if(field==='status')s.completed=val==='خوانده شده';save();renderAll()};sub.onchange=()=>sync('subject',sub.value);date.onchange=()=>sync('date',date.value);start.onchange=()=>sync('startTime',start.value);end.onchange=()=>sync('endTime',end.value);status.onchange=()=>sync('status',status.value);topic.onchange=()=>sync('topic',topic.value);done.onchange=()=>{s.completed=done.checked;s.status=done.checked?'خوانده شده':'برنامه‌ریزی شده';save();renderAll()};tr.children[7].firstChild.onclick=()=>{sessions=sessions.filter(x=>x.id!==s.id);save();renderAll()};body.appendChild(tr)}}
function renderWeek(){const wrap=document.getElementById('week');wrap.innerHTML='';const n=new Date();n.setDate(n.getDate()-((n.getDay()+1)%7)+weekOffset*7);let first='',last='';for(let i=0;i<7;i++){const d=new Date(n);d.setDate(n.getDate()+i);const ds=d.toISOString().slice(0,10);if(i===0)first=jfmt(ds);if(i===6)last=jfmt(ds);const c=document.createElement('div');c.className='daycard';c.innerHTML=`<div class="dayhead"><div><b>${DAYS[i]}</b><span>${jfmt(ds)}</span></div><button>＋</button></div><div class="daylist"></div>`;c.querySelector('button').onclick=()=>editor(null,ds);const list=c.querySelector('.daylist');sessions.filter(s=>s.date===ds).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')).forEach(s=>{const b=document.createElement('button');b.className='sessionbtn';b.innerHTML=`<b style="color:${sc(s.subject)}">${esc(s.subject)}</b><span>${fa(s.startTime)} تا ${fa(s.endTime)}</span><small>${esc(s.topic||'بدون مبحث')}</small>`;b.onclick=()=>editor(s.id);list.appendChild(b)});wrap.appendChild(c)}document.getElementById('wt').textContent=`${first} تا ${last}`}
function renderMonth(){const grid=document.getElementById('month');grid.innerHTML='';const now=new Date();const [jy,jm]=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());let serial=jy*12+(jm-1)+monthOffset;const y=Math.floor(serial/12),m=serial%12+1;document.getElementById('mt').textContent=`${MONTHS[m-1]} ${fa(y)}`;const first=j2g(y,m,1),offset=(new Date(first+'T12:00:00').getDay()+1)%7;for(let i=0;i<offset;i++)grid.appendChild(document.createElement('div'));const count=m<=6?31:m<=11?30:(((y%33)%4===3)?30:29);for(let day=1;day<=count;day++){const ds=j2g(y,m,day),cell=document.createElement('div');cell.className='monthday';const head=document.createElement('div');head.className='monthdayhead';head.innerHTML=`<b>${fa(day)}</b><button>＋ برنامه</button>`;head.lastChild.onclick=()=>editor(null,ds);cell.appendChild(head);const ta=document.createElement('textarea');ta.value=notes[ds]||'';ta.placeholder='برنامه این روز...';ta.addEventListener('input',()=>{notes[ds]=ta.value;save()});cell.appendChild(ta);const list=document.createElement('div');list.className='monthsessions';sessions.filter(s=>s.date===ds).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')).forEach(s=>{const b=document.createElement('button');b.className='minisession';b.innerHTML=`<span style="color:${sc(s.subject)}">${esc(s.subject)}</span><small>${fa(s.startTime)} · ${esc(s.topic||'بدون مبحث')}</small>`;b.onclick=()=>editor(s.id);list.appendChild(b)});cell.appendChild(list);grid.appendChild(cell)}}
function metrics(){document.getElementById('kt').textContent=fa(sessions.length);document.getElementById('kd').textContent=fa(sessions.filter(s=>s.date===today()).length);document.getElementById('kp').textContent=fa(sessions.filter(s=>!s.completed&&s.subject!=='استراحت / تفریح').length);document.getElementById('kh').textContent=fa((sessions.filter(s=>s.completed).reduce((a,s)=>a+mins(s.startTime,s.endTime),0)/60).toFixed(1))}
function editor(id=null,date=null){const existing=id?sessions.find(s=>s.id===id):null;const ov=document.createElement('div');ov.className='overlay';const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modalhead"><h3>${existing?'ویرایش برنامه':'افزودن برنامه'}</h3><button id="close">×</button></div><form class="form"><label>درس / فعالیت<select id="es">${subjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><label>تاریخ<input id="ed" type="date"></label><div class="row"><label>از<input id="est" type="time"></label><label>تا<input id="eet" type="time"></label></div><label>وضعیت<select id="ex">${STATUS.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><label>مبحث / فصل / توضیحات<textarea id="etop" rows="4" placeholder="مبحثی که قرار است مطالعه شود..."></textarea></label><div class="buttons"><button type="button" id="del" class="danger">حذف</button><div><button type="button" id="cancel" class="secondary">انصراف</button><button type="submit" class="primary">ذخیره</button></div></div></form>`;ov.appendChild(modal);document.body.appendChild(ov);const es=modal.querySelector('#es'),ed=modal.querySelector('#ed'),est=modal.querySelector('#est'),eet=modal.querySelector('#eet'),ex=modal.querySelector('#ex'),etop=modal.querySelector('#etop');es.value=existing?.subject||subjects[0]||'';ed.value=existing?.date||date||today();est.value=existing?.startTime||'09:00';eet.value=existing?.endTime||'11:00';ex.value=existing?.status||STATUS[0];etop.value=existing?.topic||'';modal.querySelector('#del').style.visibility=existing?'visible':'hidden';modal.querySelector('#close').onclick=()=>ov.remove();modal.querySelector('#cancel').onclick=()=>ov.remove();modal.querySelector('#del').onclick=()=>{if(existing){sessions=sessions.filter(s=>s.id!==existing.id);save();ov.remove();renderAll()}};modal.querySelector('form').onsubmit=e=>{e.preventDefault();const data={id:existing?.id||uid(),subject:es.value,date:ed.value,startTime:est.value,endTime:eet.value,status:ex.value,completed:ex.value==='خوانده شده',topic:etop.value};if(existing)Object.assign(existing,data);else sessions.push(data);save();ov.remove();renderAll()};ov.onclick=e=>{if(e.target===ov)ov.remove()}}
function manageSubjects(){const ov=document.createElement('div');ov.className='overlay';const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modalhead"><h3>مدیریت دروس</h3><button id="x">×</button></div><form class="form"><label>افزودن درس جدید<input id="ns" placeholder="نام درس"></label><button class="primary" type="submit">افزودن درس</button><div id="sl"></div></form>`;ov.appendChild(modal);document.body.appendChild(ov);const list=modal.querySelector('#sl');function draw(){list.innerHTML=subjects.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:11px"><span>${esc(s)}</span><button class="delete" data-s="${esc(s)}" type="button">حذف</button></div>`).join('');list.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(subjects.length<=1)return;sessions=sessions.filter(x=>x.subject!==b.dataset.s);subjects=subjects.filter(x=>x!==b.dataset.s);save();draw();renderAll()})}draw();modal.querySelector('#x').onclick=()=>ov.remove();modal.querySelector('form').onsubmit=e=>{e.preventDefault();const i=modal.querySelector('#ns'),n=i.value.trim();if(n&&!subjects.includes(n)){subjects.push(n);i.value='';save();draw();renderAll()}};ov.onclick=e=>{if(e.target===ov)ov.remove()}}
