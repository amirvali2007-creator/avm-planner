<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="پلنر تحصیلی AVM"><link rel="manifest" href="./manifest.webmanifest"><title>پلنر تحصیلی AVM</title><style>html,body{margin:0;background:#f8fafc;color:#334155}#boot{text-align:center;padding:48px 20px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style></head><body><div id="boot">در حال بارگذاری پلنر تحصیلی AVM…</div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}try{const parts=await Promise.all([1,2,3,4].map(i=>fetch('./planner-parts/'+i+'.txt?build=20260823',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('asset '+i+' '+r.status);return r.text()})));const s=parts.join('').trim();const bin=atob(s);const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('browser gzip support unavailable');const out=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!out.includes('پلنر تحصیلی AVM')||!out.includes('planner-table-body')||!out.includes('updateField'))throw Error('planner integrity check failed');document.open();document.write(out);document.close()}catch(e){document.getElementById('boot').innerHTML='پلنر در حال آماده‌سازی است؛ لطفاً صفحه را دوباره باز کنید.'}})();</script></body></html>
