<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AVM Planner"><link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;AVM Planner&quot;,&quot;short_name&quot;:&quot;AVM&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23f7f5ef&quot;,&quot;theme_color&quot;:&quot;%234f46e5&quot;}"><style>:root{--bg:#f7f5ef;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--ind:#4f46e5;--soft:#f3f4f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:var(--ind);display:grid;place-items:center;color:#fff}.brand h1{margin:0;font-size:17px}.brand p{margin:2px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer}.primary{background:var(--ind);border-color:var(--ind);color:#fff}.wrap{max-width:1400px;margin:auto;padding:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi,.card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 18px #00000008}.kpi{padding:14px}.kpi span,.kpi small{display:block;color:var(--muted);font-size:10px}.kpi b{display:block;font-si #d1d5db;border-radius:8px;padding:6px;background:#fff;font-size:10px}.madd{border:0;background:var(--ind);color:#fff;border-radius:7px;padding:4px 6px;font-size:9px;cursor:pointer}.modalbg{position:fixed;inset:0;z-index:99;background:#111827aa;display:grid;place-items:center;padding:14px}.modal{width:min(620px,100%);background:#fff;border-radius:16px;overflow:hidden}.mhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.form{padding:14px;display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:11px;font-weight:700}.form input,.form select,.form textarea{border:1px solid #d1d5db;border-radius:9px;padding:8px;font-size:11px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formfoot{display:flex;justify-content:space-between;gap:8px}.danger{border:1px solid #fecdd3;background:#fff1f2;color:#e11d48}.list{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px}.subrow{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid var(--border);font-size:11px}.subrow:last-child{border-bottom:0}@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr 1fr}.month{grid-template-columns:repeat(2,1fr)}.monthheads{grid-template-columns:repeat(2,1fr)}.monthheads>div:nth-child(n+3){display:none}}@media(max-width:620px){.top{align-items:flex-start}.brand p{display:none}.wrap{padding:9px}.grid4{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr}.month,.monthheads{grid-template-columns:1fr}.monthheads>div:nth-child(n+2){display:none}}
</style></head><body><div id="app"></div><script>'use strict';
const K={s:'avm_final_sessions_20260823',sub:'avm_final_subjects_20260823',note:'avm_final_notes_20260823'};const STATUS=['برنامه‌ریزی شده','در حال مطالعه','خوانده شده','خوانده نشده'];const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];let subjects=load(K.sub,['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح']);let sessions=load(K.s,[]),notes=load(K.note,{}),mo=0,wo=0;function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}function save(){localStorage.setItem(K.s,JSON.stringify(sessions));localStorage.setItem(K.sub,JSON.stringify(subjects));localStorage.setItem(K.note,JSON.stringify(notes))}function fa(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function pad(n){return String(n).padStart(2,'0')}function g2j(gy,gm,gd){const a=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const gy2=gm>2?gy+1:gy;let d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+a[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;jy+=Math.floor((d-1)/365);if(d>0)d=(d-1)%365;const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}function j2g(jy,jm,jd){jy-=979;let d=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd;d+=(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=1600+400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const md=[0,31,28,31,30,31,30,31,31,30,31,30,31];md[2]=(gy%4===0&&gy%100!==0)||gy%400===0?29:28;let gm=1;while(gm<=12&&gd>md[gm]){gd-=md[gm];gm++}return`${gy}-${pad(gm)}-${pad(gd)}`}function today(){return new Date().toISOString().slice(0,10)}function jf(ds){const[y,m,d]=ds.split('-').map(Number),[jy,jm,jd]=g2j(y,m,d);return`${fa(jy)}/${fa(pad(jm))}/${fa(pad(jd))}`}function color(s){return({'تغذیه':'#10b981','فیزیولوژی':'#0284c7','بیوشیمی':'#8b5cf6','زبان':'#f59e0b','استراحت / تفریح':'#f43f5e'}[s]||'#6366f1')}function minutes(a,b){if(!a||!b)return 0;const A=a.split(':').map(Number),B=b.split(':').map(Number);return Math.max(0,B[0]*60+B[1]-A[0]*60-A[1])}
function render(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><div class="logo">🎓</div><div><h1>پلنر تحصیلی AVM</h1><p>نسخه مستقل و کاملاً قابل ویرایش</p></div></div><div class="actions"><button id="subjects" class="btn">مدیریت دروس</button><button id="new" class="btn primary">＋ برنامه جدید</button></div></header><main class="wrap"><section class="grid4"><div class="kpi"><span>کل برنامه‌ها</span><b id="kt">۰</b><small>جلسه</small></div><div class="kpi"><span>ساعات برنامه‌ریزی‌شده</span><b id="kh">۰</b><small>ساعت</small></div><div class="kpi"><span>برنامه امروز</span><b id="kd">۰</b><small>جلسه</small></div><div class="kpi"><span>باقی‌مانده</span><b id="kp">۰</b><small>جلسه</small></div></section><section class="card"><div class="head"><h2>جدول اصلی — همه فیلدها قابل ویرایش</h2><div class="tools"><select id="filter"></select><input id="search" placeholder="جستجو..."></div></div><div class="tablewrap"><table><thead><tr><th>انجام</th><th>درس</th><th>تاریخ</th><th>از</th><th>تا</th><th>وضعیت</th><th>مبحث / فصل</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section><section class="card"><div class="head"><h2>تقویم هفتگی</h2><div class="tools"><button id="wp" class="btn">هفته قبل</button><span id="wt" class="tag"></span><button id="wn" class="btn">هفته بعد</button></div></div><div id="week" class="week"></div></section><section class="card"><div class="head"><div><h2>برنامه ماهانه — هر روز قابل ویرایش</h2><p>داخل هر روز برنامه خودت را بنویس؛ متن روزانه و جلسات هر دو ذخیره می‌شوند.</p></div><div class="tools"><button id="mp" class="btn">ماه قبل</button><span id="mt" class="tag"></span><button id="mn" class="btn">ماه بعد</button></div></div><div id="mh" class="monthheads"></div><div id="month" class="month"></div></section></main>`;document.getElementById('new').onclick=()=>editor();document.getElementById('subjects').onclick=subjectManager;document.getElementById('filter').onchange=table;document.getElementById('search').oninput=table;document.getElementById('wp').onclick=()=>{wo--;week()};document.getElementById('wn').onclick=()=>{wo++;week()};document.getElementById('mp').onclick=()=>{mo--;month()};document.getElementById('mn').onclick=()=>{mo++;month()};all()}
function all(){filter();table();week();month();metrics()}function filter(){const s=document.getElementById('filter'),v=s.value;s.innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');s.value=v}
function table(){const body=document.getElementById('tb'),f=document.getElementById('filter').value,q=document.getElementById('search').value.trim().toLowerCase();let list=sessions.filter(s=>(!f||s.subject===f)&&(`${s.subject} ${s.topic||''}`.toLowerCase().includes(q))).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.startTime||'').localeCompare(b.startTime||''));body.innerHTML=list.map(s=>`<tr><td><input type="checkbox" ${s.completed?'checked':''} data-done="${s.id}"></td><td><select class="edit" data-k="subject" data-id="${s.id}">${subjects.map(x=>`<option value="${esc(x)}" ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit" data-k="date" data-id="${s.id}" type="date" value="${esc(s.date)}"></td><td><input class="edit time" data-k="startTime" data-id="${s.id}" type="time" value="${esc(s.startTime)}"></td><td><input class="edit time" data-k="endTime" data-id="${s.id}" type="time" value="${esc(s.endTime)}"></td><td><select class="edit" data-k="status" data-id="${s.id}">${STATUS.map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></td><td><input class="edit topic" data-k="topic" data-id="${s.id}" value="${esc(s.topic||'')}" placeholder="مبحث / فصل"></td><td><button class="btn danger" data-del="${s.id}">حذف</button></td></tr>`).join('');body.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{const s=sessions.find(x=>x.id===e.dataset.id);if(!s)return;s[e.dataset.k]=e.value;if(e.dataset.k==='status')s.completed=e.value==='خوانده شده';save();all()});body.querySelectorAll('[data-done]').forEach(e=>e.onchange=()=>{const s=sessions.find(x=>x.id===e.dataset.done);if(!s)return;s.completed=e.checked;s.status=e.checked?'خوانده شده':'برنامه‌ریزی شده';save();all()});body.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{sessions=sessions.filter(x=>x.id!==e.dataset.del);save();all()})}
function week(){const w=document.getElementById('week');w.innerHTML='';const base=new Date();base.setDate(base.getDate()-((base.getDay()+1)%7)+wo*7);let a='',z='';for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const ds=d.toISOString().slice(0,10);if(i===0)a=jf(ds);if(i===6)z=jf(ds);const c=document.createElement('div');c.className='day';c.innerHTML=`<div class="daytop"><div><b>${DAYS[i]}</b><span>${jf(ds)}</span></div><button>＋</button></div><div></div>`;c.querySelector('button').onclick=()=>editor(null,ds);const list=c.querySelector('div:last-child');sessions.filter(s=>s.date===ds).sort((x,y)=>(x.startTime||'').localeCompare(y.startTime||'')).forEach(s=>{const b=document.createElement('button');b.className='mini';b.innerHTML=`<b style="color:${color(s.subject)}">${esc(s.subject)}</b><small>${fa(s.startTime)}–${fa(s.endTime)} · ${esc(s.topic||'')}</small>`;b.onclick=()=>editor(s.id);list.appendChild(b)});w.appendChild(c)}document.getElementById('wt').textContent=`${a} تا ${z}`}
function month(){const mEl=document.getElementById('month');mEl.innerHTML='';const now=new Date();let[jy,jm]=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());let serial=jy*12+jm-1+mo;const y=Math.floor(serial/12),m=serial%12+1;document.getElementById('mt').textContent=`${MONTHS[m-1]} ${fa(y)}`;document.getElementById('mh').innerHTML=DAYS.map(d=>`<div>${d}</div>`).join('');const first=j2g(y,m,1),off=(new Date(first+'T12:00:00').getDay()+1)%7;for(let i=0;i<off;i++)mEl.appendChild(document.createElement('div'));const count=m<=6?31:m<=11?30:((y%4===3)?30:29);for(let day=1;day<=count;day++){const ds=j2g(y,m,day),c=document.createElement('div');c.className='mday';c.innerHTML=`<div class="monthtop"><b>${fa(day)}</b><button class="madd">＋ برنامه</button></div>`;c.querySelector('button').onclick=()=>editor(null,ds);const ta=document.createElement('textarea');ta.placeholder='برنامه این روز را اینجا بنویس...';ta.value=notes[ds]||'';ta.oninput=()=>{notes[ds]=ta.value;save()};c.appendChild(ta);const list=document.createElement('div');sessions.filter(s=>s.date===ds).sort((x,y)=>(x.startTime||'').localeCompare(y.startTime||'')).forEach(s=>{const b=document.createElement('button');b.className='mini';b.innerHTML=`<b style="color:${color(s.subject)}">${esc(s.subject)}</b><small>${fa(s.startTime)} · ${esc(s.topic||'بدون مبحث')}</small>`;b.onclick=()=>editor(s.id);list.appendChild(b)});c.appendChild(list);mEl.appendChild(c)}}
function metrics(){document.getElementById('kt').textContent=fa(sessions.length);document.getElementById('kh').textContent=fa((sessions.reduce((a,s)=>a+minutes(s.startTime,s.endTime),0)/60).toFixed(1));document.getElementById('kd').textContent=fa(sessions.filter(s=>s.date===today()).length);document.getElementById('kp').textContent=fa(sessions.filter(s=>!s.completed&&s.subject!=='استراحت / تفریح').length)}
function editor(id=null,date=null){const old=id?sessions.find(s=>s.id===id):null,ov=document.createElement('div');ov.className='modalbg';ov.innerHTML=`<div class="modal"><div class="mhead"><b>${old?'ویرایش برنامه':'برنامه جدید'}</b><button id="x" class="btn">×</button></div><form class="form"><label>درس / فعالیت<select id="es">${subjects.map(s=>`<option value="${esc(s)}" ${s===(old?.subject||subjects[0])?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>تاریخ<input id="ed" type="date" value="${old?.date||date||today()}"></label><div class="row2"><label>از<input id="st" class="time" type="time" value="${old?.startTime||'09:00'}"></label><label>تا<input id="et" class="time" type="time" value="${old?.endTime||'11:00'}"></label></div><label>وضعیت<select id="sx">${STATUS.map(s=>`<option ${s===(old?.status||STATUS[0])?'selected':''}>${s}</option>`).join('')}</select></label><label>مبحث / فصل / توضیحات<textarea id="tp" rows="4" placeholder="فصل، مبحث، تست‌ها..."></textarea></label><div class="formfoot"><div>${old?'<button type="button" id="del" class="btn danger">حذف</button>':''}</div><div><button type="button" id="cancel" class="btn">انصراف</button><button class="btn primary" type="submit">ذخیره</button></div></div></form></div>`;document.body.appendChild(ov);ov.querySelector('#tp').value=old?.topic||'';ov.querySelector('#x').onclick=()=>ov.remove();ov.querySelector('#cancel').onclick=()=>ov.remove();if(old)ov.querySelector('#del').onclick=()=>{if(confirm('حذف شود؟')){sessions=sessions.filter(s=>s.id!==old.id);save();ov.remove();all()}};ov.querySelector('form').onsubmit=e=>{e.preventDefault();const data={id:old?.id||uid(),subject:ov.querySelector('#es').value,date:ov.querySelector('#ed').value,startTime:ov.querySelector('#st').value,endTime:ov.querySelector('#et').value,status:ov.querySelector('#sx').value,completed:ov.querySelector('#sx').value==='خوانده شده',topic:ov.querySelector('#tp').value.trim()};if(old)Object.assign(old,data);else sessions.unshift(data);save();ov.remove();all()};ov.onclick=e=>{if(e.target===ov)ov.remove()}}
function subjectManager(){const ov=document.createElement('div');ov.className='modalbg';ov.innerHTML=`<div class="modal"><div class="mhead"><b>مدیریت دروس</b><button class="btn" id="x">×</button></div><div class="form"><label>درس جدید<input id="ns" placeholder="نام درس"></label><button id="as" class="btn primary">افزودن درس</button><div class="list">${subjects.map(s=>`<div class="subrow"><span>${esc(s)}</span><button class="btn danger" data-s="${esc(s)}">حذف</button></div>`).join('')}</div></div></div>`;document.body.appendChild(ov);ov.querySelector('#x').onclick=()=>ov.remove();ov.querySelector('#as').onclick=()=>{const v=ov.querySelector('#ns').value.trim();if(v&&!subjects.includes(v)){subjects.push(v);save();ov.remove();all()}};ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(subjects.length>1){subjects=subjects.filter(x=>x!==b.dataset.s);save();ov.remove();all()}})}
(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}})();render();
</script></body></html>
