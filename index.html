<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D3D2D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AVM Planner"><link rel="manifest" href="./manifest.webmanifest"><title>AVM Planner</title><style>body{margin:0;background:#F7F5EF;color:#0D3D2D;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{text-align:center;padding:48px 20px}</style></head><body><div id="boot">در حال بارگذاری AVM Planner…</div><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});async function boot(){try{const r=await fetch("./planner.b64",{cache:"no-store"});if(!r.ok)throw Error("planner asset unavailable ("+r.status+")");const s=(await r.text()).trim();const bin=atob(s);const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));if(!window.DecompressionStream)throw Error("This browser does not support compressed planner loading.");const ds=new DecompressionStream("gzip");const out=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(out);document.close()}catch(e){document.getElementById("boot").innerHTML="AVM Planner could not load.<br><small>"+String(e.message||e)+"</small>"}}boot()</script></body></html>
