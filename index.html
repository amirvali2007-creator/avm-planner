<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D3D2D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVM Planner"><link rel="manifest" href="./manifest.webmanifest"><title>AVM Planner</title><style>body{margin:0;background:#F7F5EF;color:#172033;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{color:#0D3D2D;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:14px}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #e4e7ec;background:#fff;border-radius:9px;padding:8px 12px}.primary{background:#0D3D2D;color:#fff;border-color:#0D3D2D}.danger{color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px;margin-top:14px;box-shadow:0 4px 18px #00000008}.kpi{padding:13px}.kpi small{display:block;color:#667085}.kpi b{font-size:23px;display:block;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.head h2{font-size:16px;margin:0;color:#0D3D2D}.tablewrap{overflow:auto}table{width:100%;min-width:1050px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e4e7ec;vertical-align:middle}th{background:#fafafa;color:#667085;font-size:11px}.edit{width:100%;border:1px solid #cfd5dd;border-radius:8px;background:#fff;padding:7px;font-size:12px}.topic{min-width:220px}.time{direction:ltr;text-align:center;width:100px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:1px solid #e4e7ec;border-radius:11px;background:#fafafa;padding:8px;min-height:175px}.dayhead{display:flex;justify-content:space-between;gap:5px;align-items:center}.mini{display:block;width:100%;text-align:right;background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:7px;margin-top:6px}.mini small{display:block;color:#667085;margin-top:3px}.monthnav{display:flex;gap:8px;align-items:center}.monthgrid,.weekheads{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekheads div{text-align:center;background:#f0f2f1;border-radius:7px;padding:7px;font-weight:700;font-size:11px;color:#0D3D2D}.mday{min-height:235px;border:1px solid #e4e7ec;border-radius:10px;background:#fafafa;padding:7px}.mdate{font-weight:800;color:#0D3D2D;display:flex;justify-content:space-between;align-items:center}.daynote{width:100%;min-height:95px;resize:vertical;margin-top:7px;border:1px solid #cfd5dd;border-radius:8px;padding:7px;background:#fff;font-size:11px}.msession{display:flex;gap:4px;align-items:center;margin-top:5px}.msession button{flex:1;border:1px solid #e4e7ec;background:#fff;border-radius:7px;padding:5px;text-align:right;font-size:10px}.addsmall{border:0;background:#0D3D2D;color:#fff;border-radius:7px;padding:5px 7px;font-size:10px}.modalbg{position:fixed;inset:0;background:#11182799;z-index:100;display:grid;place-items:center;padding:15px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px}.mhead{padding:12px 15px;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between;align-items:center}.form{padding:15px;display:grid;gap:10px}.form label{display:grid;gap:5px;font-weight:700;font-size:12px}.form input,.form select,.form textarea{border:1px solid #cfd5dd;border-radius:8px;padding:8px;background:#fff}.actions{display:flex;justify-content:flex-start;gap:8px;padding:0 15px 15px}.subjectrow{display:flex;gap:7px}.subjectrow input{flex:1}.notice{color:#667085;font-size:11px}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr 1fr}.monthgrid,.weekheads{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.week,.monthgrid,.weekheads{grid-template-columns:1fr}}</style></head><body><script>(async()=>{try{if("serviceWorker"in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}})();</script><header class="top"><div class="brand">🎓 پلنر تحصیلی AVM</div><div class="tools"><button id="manageSubjects" class="btn">مدیریت دروس</button><button id="newSession" class="btn primary">＋ برنامه جدید</button></div></header><main class="wrap"><section class="grid"><div class="card kpi"><small>کل برنامه‌ها</small><b id="total">۰</b></div><div class="card kpi"><small>ساعات برنامه‌ریزی‌شده</small><b id="hours">۰</b></div><div class="card kpi"><small>برنامه امروز</small><b id="todayCount">۰</b></div><div class="card kpi"><small>انجام‌نشده</small><b id="remaining">۰</b></div></section><section class="card"><div class="head"><h2>جدول روزانه — کاملاً قابل ویرایش</h2><div class="tools"><select id="filter"></select><input id="search" placeholder="جستجو در درس و مبحث"></div></div><div class="tablewrap"><table><thead><tr><th>انجام</th><th>درس</th><th>تاریخ</th><th>شروع</th><th>پایان</th><th>وضعیت</th><th>مبحث / فصل</th><th>عملیات</th></tr></thead><tbody id="tbody"></tbody></table></div><p class="notice">هر سلول سفید جدول مستقیماً قابل ویرایش است و تغییرات همان لحظه ذخیره می‌شوند.</p></section><section class="card"><div class="head"><h2>تقویم هفتگی</h2><div class="monthnav"><button id="prevWeek" class="btn">هفته قبل</button><span id="weekTitle"></span><button id="nextWeek" class="btn">هفته بعد</button></div></div><div id="week" class="week"></div></section><section class="card"><div class="head"><h2>برنامه ماهانه — هر روز قابل ویرایش</h2><div class="monthnav"><button id="prevMonth" class="btn">ماه قبل</button><b id="monthTitle"></b><button id="nextMonth" class="btn">ماه بعد</button></div></div><div id="weekHeads" class="weekheads"></div><div id="month" class="monthgrid"></div></section></main><div id="modal" class="hidden"></div><script>'use strict';const KEY={sessions:'avm_final_sessions_v10',subjects:'avm_final_subjects_v10',notes:'avm_final_month_notes_v10'},DEFAULT=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'],STATUS=['برنامه‌ریزی شده','در حال مطالعه','خوانده شده','خوانده نشده'],DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'],MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];let subjects=read(KEY.subjects,DEFAULT.slice()),sessions=read(KEY.sessions,[]),notes=read(KEY.notes,{}),monthOffset=0,weekOffset=0;function read(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function save(){localStorage.setItem(KEY.subjects,JSON.stringify(subjects));localStorage.setItem(KEY.sessions,JSON.stringify(sessions));localStorage.setItem(KEY.notes,JSON.stringify(notes))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fa(v){return String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function id(){return crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}function today(){return new Date().toISOString().slice(0,10)}function g2j(gy,gm,gd){const a=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const gy2=gm>2?gy+1:gy;let d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+a[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;jy+=Math.floor((d-1)/365);if(d>0)d=(d-1)%365;return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}function j2g(jy,jm,jd){jy-=979;let d=365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+78+jd;d+=jm<7?(jm-1)*31:(jm-7)*30+186;let gy=1600+400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1,md=[0,31,28,31,30,31,30,31,31,30,31,30,31];md[2]=gy%4===0&&gy%100!==0||gy%400===0?29:28;let gm=1;while(gm<=12&&gd>md[gm]){gd-=md[gm];gm++}return`${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}function jf(ds){const[y,m,d]=ds.split('-').map(Number),[jy,jm,jd]=g2j(y,m,d);return`${fa(jd)} ${MONTHS[jm-1]} ${fa(jy)}`}function render(){fillFilter();renderTable();renderWeek();renderMonth();metrics()}function fillFilter(){const f=document.getElementById('filter'),v=f.value;f.innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(subjects.includes(v))f.value=v}function renderTable(){const body=document.getElementById('tbody'),f=document.getElementById('filter').value,q=document.getElementById('search').value.trim().toLowerCase();let list=sessions.filter(s=>(!f||s.subject===f)&&(`${s.subject} ${s.topic||''}`.toLowerCase().includes(q)));list.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||''));body.innerHTML=list.map(s=>`<tr><td><input type="checkbox" data-action="done" data-id="${s.id}" ${s.done?'checked':''}></td><td><select class="edit" data-field="subject" data-id="${s.id}">${subjects.map(x=>`<option ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit" type="date" data-field="date" data-id="${s.id}" value="${esc(s.date)}"></td><td><input class="edit time" type="time" data-field="start" data-id="${s.id}" value="${esc(s.start)}"></td><td><input class="edit time" type="time" data-field="end" data-id="${s.id}" value="${esc(s.end)}"></td><td><select class="edit" data-field="status" data-id="${s.id}">${STATUS.map(x=>`<option ${x===s.status?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit topic" data-field="topic" data-id="${s.id}" value="${esc(s.topic||'')}" placeholder="مثلاً فصل ۳ — پروتئین‌ها"></td><td><button class="btn danger" data-action="delete" data-id="${s.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:25px">هنوز برنامه‌ای ثبت نشده؛ از «＋ برنامه جدید» شروع کن.</td></tr>';body.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{const s=sessions.find(x=>x.id===el.dataset.id);if(!s)return;s[el.dataset.field]=el.value;if(el.dataset.field==='status')s.done=el.value==='خوانده شده';save();render()}));body.querySelectorAll('[data-action="done"]').forEach(el=>el.addEventListener('change',()=>{const s=sessions.find(x=>x.id===el.dataset.id);if(!s)return;s.done=el.checked;s.status=s.done?'خوانده شده':'برنامه‌ریزی شده';save();render()}));body.querySelectorAll('[data-action="delete"]').forEach(el=>el.onclick=()=>{sessions=sessions.filter(x=>x.id!==el.dataset.id);save();render()})}function renderWeek(){const wrap=document.getElementById('week');wrap.innerHTML='';const base=new Date();base.setHours(12,0,0,0);const start=(base.getDay()+1)%7;base.setDate(base.getDate()-start+weekOffset*7);document.getElementById('weekTitle').textContent='هفته قابل ویرایش';for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const ds=d.toISOString().slice(0,10),el=document.createElement('div');el.className='day';el.innerHTML=`<div class="dayhead"><b>${DAYS[i]}</b><button class="addsmall">＋</button></div><small>${jf(ds)}</small><div class="items"></div>`;el.querySelector('.addsmall').onclick=()=>openEditor(null,ds);sessions.filter(s=>s.date===ds).forEach(s=>{const b=document.createElement('button');b.className='mini';b.innerHTML=`<b>${esc(s.subject)}</b><small>${fa(s.start||'')} – ${fa(s.end||'')} · ${esc(s.topic||'بدون مبحث')}</small>`;b.onclick=()=>openEditor(s.id);el.querySelector('.items').appendChild(b)});wrap.appendChild(el)}}function monthInfo(){const now=new Date(),[jy,jm]=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());let serial=jy*12+jm-1+monthOffset,y=Math.floor(serial/12),m=serial-y*12+1;return[y,m]}function renderMonth(){const[jy,jm]=monthInfo(),grid=document.getElementById('month');document.getElementById('monthTitle').textContent=`${MONTHS[jm-1]} ${fa(jy)}`;document.getElementById('weekHeads').innerHTML=DAYS.map(d=>`<div>${d}</div>`).join('');grid.innerHTML='';const first=j2g(jy,jm,1),fd=new Date(first+'T12:00:00'),offset=(fd.getDay()+1)%7,days=jm<=6?31:jm<=11?30:(jy%4===3?30:29);for(let i=0;i<offset;i++)grid.appendChild(document.createElement('div'));for(let day=1;day<=days;day++){const ds=j2g(jy,jm,day),cell=document.createElement('div');cell.className='mday';cell.innerHTML=`<div class="mdate"><span>${fa(day)}</span><button class="addsmall">＋ برنامه</button></div><textarea class="daynote" placeholder="برنامه این روز را اینجا بنویس...">${esc(notes[ds]||'')}</textarea><div class="msessions"></div>`;cell.querySelector('.daynote').addEventListener('input',e=>{notes[ds]=e.target.value;save()});cell.querySelector('.addsmall').onclick=()=>openEditor(null,ds);sessions.filter(s=>s.date===ds).forEach(s=>{const row=document.createElement('div');row.className='msession';const b=document.createElement('button');b.innerHTML=`${esc(s.subject)} · ${fa(s.start||'')}–${fa(s.end||'')}<br><small>${esc(s.topic||'بدون مبحث')}</small>`;b.onclick=()=>openEditor(s.id);row.appendChild(b);cell.querySelector('.msessions').appendChild(row)});grid.appendChild(cell)}while(grid.children.length%7)grid.appendChild(document.createElement('div'))}function metrics(){document.getElementById('total').textContent=fa(sessions.length);document.getElementById('todayCount').textContent=fa(sessions.filter(s=>s.date===today()).length);document.getElementById('remaining').textContent=fa(sessions.filter(s=>!s.done).length);let mins=0;sessions.forEach(s=>{if(s.start&&s.end){const[a,b]=s.start.split(':').map(Number),[c,d]=s.end.split(':').map(Number),n=c*60+d-(a*60+b);if(n>0)mins+=n}});document.getElementById('hours').textContent=fa((mins/60).toFixed(1))+' ساعت'}function openEditor(editId,date){const old=editId?sessions.find(s=>s.id===editId):null,s=old?{...old}:{id:id(),subject:subjects[0]||'',date:date||today(),start:'08:00',end:'09:00',status:'برنامه‌ریزی شده',topic:'',done:false};showModal(`<div class="mhead"><b>${old?'ویرایش برنامه':'برنامه جدید'}</b><button class="btn" id="close">بستن</button></div><form class="form"><label>درس<select id="subject">${subjects.map(x=>`<option ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>تاریخ<input id="date" type="date" value="${esc(s.date)}"></label><label>زمان شروع<input id="start" type="time" value="${esc(s.start)}"></label><label>زمان پایان<input id="end" type="time" value="${esc(s.end)}"></label><label>وضعیت<select id="status">${STATUS.map(x=>`<option ${x===s.status?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>مبحث / فصل<textarea id="topic" rows="4" placeholder="مبحثی که قرار است مطالعه شود...">${esc(s.topic||'')}</textarea></label><div class="actions"><button type="button" class="btn primary" id="saveSession">ذخیره</button><button type="button" class="btn" id="cancel">انصراف</button></div></form>`);document.getElementById('close').onclick=closeModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('saveSession').onclick=()=>{s.subject=document.getElementById('subject').value;s.date=document.getElementById('date').value;s.start=document.getElementById('start').value;s.end=document.getElementById('end').value;s.status=document.getElementById('status').value;s.topic=document.getElementById('topic').value;s.done=s.status==='خوانده شده';if(!s.date)return;if(old){const i=sessions.findIndex(x=>x.id===s.id);sessions[i]=s}else sessions.push(s);save();closeModal();render()}}function subjectManager(){showModal(`<div class="mhead"><b>مدیریت دروس</b><button class="btn" id="close">بستن</button></div><div class="form"><div class="subjectrow"><input id="newSubject" placeholder="نام درس جدید"><button type="button" class="btn primary" id="addSubject">افزودن</button></div><div>${subjects.map((s,i)=>`<div class="subjectrow" style="margin-top:7px"><input data-sub="${i}" value="${esc(s)}"><button type="button" class="btn danger" data-remove="${i}">حذف</button></div>`).join('')}</div></div>`);document.getElementById('close').onclick=closeModal;document.getElementById('addSubject').onclick=()=>{const x=document.getElementById('newSubject').value.trim();if(x&&!subjects.includes(x)){subjects.push(x);save();subjectManager();render()}};document.querySelectorAll('[data-sub]').forEach(el=>el.addEventListener('change',()=>{const i=Number(el.dataset.sub),old=subjects[i],v=el.value.trim();if(!v||subjects.includes(v)&&v!==old)return;subjects[i]=v;sessions.forEach(s=>{if(s.subject===old)s.subject=v});save();subjectManager();render()}));document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{if(subjects.length<=1)return;subjects.splice(Number(el.dataset.remove),1);save();subjectManager();render()})}function showModal(html){const m=document.getElementById('modal');m.className='modalbg';m.innerHTML=`<div class="modal">${html}</div>`}function closeModal(){const m=document.getElementById('modal');m.className='hidden';m.innerHTML=''}document.getElementById('newSession').onclick=()=>openEditor(null);document.getElementById('manageSubjects').onclick=subjectManager;document.getElementById('filter').onchange=renderTable;document.getElementById('search').oninput=renderTable;document.getElementById('prevWeek').onclick=()=>{weekOffset--;renderWeek()};document.getElementById('nextWeek').onclick=()=>{weekOffset++;renderWeek()};document.getElementById('prevMonth').onclick=()=>{monthOffset--;renderMonth()};document.getElementById('nextMonth').onclick=()=>{monthOffset++;renderMonth()};render();</script></body></html>
