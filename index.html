<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D3D2D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AVM Planner"><link rel="manifest" href="manifest.webmanifest"><title>AVM Planner</title></head><body><div id="boot" style="font-family:system-ui;text-align:center;padding:40px;color:#0D3D2D">Loading AVM Planner…</div><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}async function boot(){try{const r=await fetch('./planner.b64');const s=await r.text();const bin=atob(s.trim());const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const out=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(out);document.close();}catch(e){document.getElementById('boot').innerHTML='AVM Planner could not load.<br><small>'+e.message+'</small>';}}boot();</script></body></html>
