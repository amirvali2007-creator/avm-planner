<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="پلنر AVM"><link rel="manifest" href="./manifest.webmanifest"><title>AVM Planner</title><style>body{margin:0;background:#F7F5EF;color:#0D3D2D;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{text-align:center;padding:48px 20px}</style></head><body><div id="boot">در حال بارگذاری AVM Planner…</div><script>(async()=>{try{const r=await fetch('./planner.b64?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('planner asset unavailable ('+r.status+')');let s=(await r.text()).trim().replace(/^['"]|['"]$/g,'');const bin=atob(s);const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));if(u8[0]!==31||u8[1]!==139)throw Error('planner asset is not a valid gzip payload');if(!('DecompressionStream'in window))throw Error('این مرورگر از بارگذاری فشرده پشتیبانی نمی‌کند.');const out=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const patched=out.replace('</body>','<script src="./fixes.js?v=3"></script></body>');document.open();document.write(patched);document.close()}catch(e){document.getElementById('boot').innerHTML='AVM Planner could not load.<br><small>'+String(e.message||e)+'</small>'}})();</script></body></html>
