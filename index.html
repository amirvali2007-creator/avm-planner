<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پلنر تحصیلی AVM — نسخه نهایی</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="پلنر AVM">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D9%BE%D9%84%D9%86%D8%B1%20%D8%AA%D8%AD%D8%B5%DB%8C%D9%84%DB%8C%20AVM%22%2C%22short_name%22%3A%22AVM%20Planner%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%234f46e5%22%7D">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root{--bg:#f7f5ef;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--ind:#4f46e5;--soft:#f3f4f6}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
        .brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:var(--ind);display:grid;place-items:center;color:#fff}.brand h1{margin:0;font-size:17px}.brand p{margin:2px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:8px}
        .btn{border:1px solid var(--border);background:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer}.primary{background:var(--ind);border-color:var(--ind);color:#fff}.wrap{max-width:1400px;margin:auto;padding:14px}
        .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi,.card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 18px #00000008}.kpi{padding:14px}.kpi span,.kpi small{display:block;color:var(--muted);font-size:10px}.kpi b{display:block;font-size:22px;margin:4px 0}
        .card{padding:14px;margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.head h2{font-size:13px;margin:0}.head p{font-size:10px;color:var(--muted);margin:3px 0}.head .tools{display:flex;gap:7px;align-items:center}.head input,.head select{border:1px solid var(--border);border-radius:9px;padding:7px;background:#fff;font-size:11px}
        .tablewrap{overflow:auto}table{width:100%;min-width:980px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}th{font-size:10px;color:var(--muted);background:#fafafa}
        .edit{width:100%;padding:7px 8px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:11px}.edit:focus{outline:2px solid #e0e7ff;border-color:#818cf8}.topic{min-width:220px}.time{width:90px;direction:ltr}
        .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:1px solid var(--border);border-radius:12px;padding:8px;min-height:180px;background:#fafafa}.daytop,.monthtop{display:flex;justify-content:space-between;align-items:center}.daytop{padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:6px}.daytop span{display:block;font-size:9px;color:var(--muted)}.daytop button{border:0;background:var(--ind);color:#fff;border-radius:7px;padding:4px 6px;font-size:9px;cursor:pointer}
        .mini{width:100%;text-align:right;border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px;margin-top:5px;cursor:pointer}.mini b,.mini small{display:block}.mini small{font-size:9px;color:var(--muted);margin-top:2px}
        .monthheads,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.monthheads>div{background:var(--soft);padding:7px;text-align:center;border-radius:7px;font-size:10px;color:var(--muted);font-weight:700}.mday{min-height:200px;border:1px solid var(--border);border-radius:10px;background:#fafafa;padding:7px}.mday textarea{width:100%;min-height:86px;resize:vertical;border:1px solid #d1d5db;border-radius:8px;padding:6px;background:#fff;font-size:10px}.madd{border:0;background:var(--ind);color:#fff;border-radius:7px;padding:4px 6px;font-size:9px;cursor:pointer}
        .modalbg{position:fixed;inset:0;z-index:99;background:#111827aa;display:grid;place-items:center;padding:14px}.modal{width:min(620px,100%);background:#fff;border-radius:16px;overflow:hidden}.mhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.form{padding:14px;display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:11px;font-weight:700}.form input,.form select,.form textarea{border:1px solid #d1d5db;border-radius:9px;padding:8px;font-size:11px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formfoot{display:flex;justify-content:space-between;gap:8px}.danger{border:1px solid #fecdd3;background:#fff1f2;color:#e11d48}.list{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px}.subrow{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid var(--border);font-size:11px}.subrow:last-child{border-bottom:0}
        @media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr 1fr}.month{grid-template-columns:repeat(2,1fr)}.monthheads{grid-template-columns:repeat(2,1fr)}.monthheads>div:nth-child(n+3){display:none}}@media(max-width:620px){.top{align-items:flex-start}.brand p{display:none}.wrap{padding:9px}.grid4{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr}.month,.monthheads{grid-template-columns:1fr}.monthheads>div:nth-child(n+2){display:none}}
    </style>
</head><body>
<script>try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}}catch(e){} try{if(window.caches)caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{})}catch(e){}</script>
<div id="app"></div>
<script>
'use strict';
const K={s:'avm_final_sessions_20260823_v2',sub:'avm_final_subjects_20260823_v2',note:'avm_final_notes_20260823_v2'};
const STATUS=['برنامه‌ریزی شده','در حال مطالعه','خوانده شده','خوانده نشده'];
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
let subjects=load(K.sub,['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح']);
let sessions=load(K.s,[]), notes=load(K.note,{}), mo=0, wo=0;
if(!Array.isArray(subjects)||!subjects.length)subjects=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'];
if(!Array.isArray(sessions))sessions=[];if(!notes||typeof notes!=='object')notes={};
function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}
function save(){localStorage.setItem(K.s,JSON.stringify(sessions));localStorage.setItem(K.sub,JSON.stringify(subjects));localStorage.setItem(K.note,JSON.stringify(notes))}
function fa(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function pad(n){return String(n).padStart(2,'0')}
function g2j(gy,gm,gd){const a=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const gy2=gm>2?gy+1:gy;let d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+a[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;jy+=Math.floor((d-1)/365);if(d>0)d=(d-1)%365;const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy-=979;let d=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd;d+=jm<7?(jm-1)*31:(jm-7)*30+186;let gy=1600+400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const md=[0,31,28,31,30,31,30,31,31,30,31,30,31];md[2]=(gy%4===0&&gy%100!==0)||gy%400===0?29:28;let gm=1;while(gm<=12&&gd>md[gm]){gd-=md[gm];gm++}return`${gy}-${pad(gm)}-${pad(gd)}`}
function today(){return new Date().toISOString().slice(0,10)}
function jf(ds){const[y,m,d]=ds.split('-').map(Number),[jy,jm,jd]=g2j(y,m,d);return`${fa(jy)}/${fa(pad(jm))}/${fa(pad(jd))}`}
function color(s){return({'تغذیه':'#10b981','فیزیولوژی':'#0284c7','بیوشیمی':'#8b5cf6','زبان':'#f59e0b','استراحت / تفریح':'#f43f5e'}[s]||'#6366f1')}
function minutes(a,b){if(!a||!b)return 0;const A=a.split(':').map(Number),B=b.split(':').map(Number);return Math.max(0,B[0]*60+B[1]-A[0]*60-A[1])}
function render(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><div class="logo">🎓</div><div><h1>پلنر تحصیلی AVM</h1><p>نسخه نهایی — کاملاً قابل ویرایش و ذخیره‌شونده</p></div></div><div class="actions"><button id="subjects" class="btn">مدیریت دروس</button><button id="new" class="btn primary">＋ برنامه جدید</button></div></header><main class="wrap"><section class="grid4"><div class="kpi"><span>کل برنامه‌ها</span><b id="kt">۰</b><small>جلسه</small></div><div class="kpi"><span>ساعات برنامه‌ریزی‌شده</span><b id="kh">۰</b><small>ساعت</small></div><div class="kpi"><span>برنامه امروز</span><b id="kd">۰</b><small>جلسه</small></div><div class="kpi"><span>باقی‌مانده</span><b id="kp">۰</b><small>جلسه</small></div></section><section class="card"><div class="head"><h2>جدول اصلی — همه فیلدها قابل ویرایش</h2><div class="tools"><select id="filter"></select><input id="search" placeholder="جستجو..."></div></div><div class="tablewrap"><table><thead><tr><th>انجام</th><th>درس</th><th>تاریخ</th><th>از</th><th>تا</th><th>وضعیت</th><th>مبحث / فصل</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section><section class="card"><div class="head"><h2>تقویم هفتگی</h2><div class="tools"><button id="wp" class="btn">هفته قبل</button><span id="wt" class="tag"></span><button id="wn" class="btn">هفته بعد</button></div></div><div id="week" class="week"></div></section><section class="card"><div class="head"><div><h2>برنامه ماهانه — هر روز قابل ویرایش</h2><p>داخل هر روز می‌توانی برنامه‌ات را بنویسی و جلسات همان روز را هم ویرایش کنی.</p></div><div class="tools"><button id="mp" class="btn">ماه قبل</button><span id="mt" class="tag"></span><button id="mn" class="btn">ماه بعد</button></div></div><div id="mheads" class="monthheads"></div><div id="month" class="month"></div></section></main>`;document.getElementById('new').onclick=()=>openEditor();document.getElementById('subjects').onclick=manageSubjects;document.getElementById('filter').onchange=renderTable;document.getElementById('search').oninput=renderTable;document.getElementById('wp').onclick=()=>{wo--;renderWeek()};document.getElementById('wn').onclick=()=>{wo++;renderWeek()};document.getElementById('mp').onclick=()=>{mo--;renderMonth()};document.getElementById('mn').onclick=()=>{mo++;renderMonth()};renderAll()}
function renderAll(){renderFilter();renderTable();renderWeek();renderMonth();metrics()}
function renderFilter(){const s=document.getElementById('filter'),v=s.value;s.innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(subjects.includes(v))s.value=v}
function renderTable(){const body=document.getElementById('tb'),f=document.getElementById('filter').value,q=document.getElementById('search').value.trim().toLowerCase();let list=sessions.filter(s=>(!f||s.subject===f)&&(`${s.subject} ${s.topic||''}`.toLowerCase().includes(q)));list.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.startTime||'').localeCompare(b.startTime||''));body.innerHTML=list.map(s=>{const c=color(s.subject);return`<tr><td><input type="checkbox" ${s.completed?'checked':''} data-done="${s.id}"></td><td><select class="edit" data-field="subject" data-id="${s.id}" style="color:${c}">${subjects.map(x=>`<option value="${esc(x)}" ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit" data-field="date" data-id="${s.id}" type="date" value="${esc(s.date)}"></td><td><input class="edit time" data-field="startTime" data-id="${s.id}" type="time" value="${esc(s.startTime)}"></td><td><input class="edit time" data-field="endTime" data-id="${s.id}" type="time" value="${esc(s.endTime)}"></td><td><select class="edit" data-field="status" data-id="${s.id}">${STATUS.map(x=>`<option value="${esc(x)}" ${x===s.status?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit topic" data-field="topic" data-id="${s.id}" value="${esc(s.topic||'')}" placeholder="مبحث / فصل"></td><td><button class="btn danger" data-del="${s.id}">حذف</button></td></tr>`}).join('');body.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{const s=sessions.find(x=>x.id===el.dataset.id);if(!s)return;s[el.dataset.field]=el.value;if(el.dataset.field==='status')s.completed=el.value==='خوانده شده';save();renderAll()}));body.querySelectorAll('[data-done]').forEach(el=>el.addEventListener('change',()=>{const s=sessions.find(x=>x.id===el.dataset.done);if(!s)return;s.completed=el.checked;s.status=el.checked?'خوانده شده':'برنامه‌ریزی شده';save();renderAll()}));body.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{sessions=sessions.filter(x=>x.id!==el.dataset.del);save();renderAll()})}
function renderWeek(){const wrap=document.getElementById('week');wrap.innerHTML='';const base=new Date();base.setDate(base.getDate()-((base.getDay()+1)%7)+wo*7);let a='',b='';for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const ds=d.toISOString().slice(0,10);if(i===0)a=jf(ds);if(i===6)b=jf(ds);const card=document.createElement('div');card.className='day';card.innerHTML=`<div class="daytop"><div><b>${DAYS[i]}</b><span>${jf(ds)}</span></div><button>＋</button></div><div></div>`;card.querySelector('button').onclick=()=>openEditor(null,ds);const list=card.lastElementChild;sessions.filter(s=>s.date===ds).sort((x,y)=>(x.startTime||'').localeCompare(y.startTime||'')).forEach(s=>{const el=document.createElement('button');el.className='mini';el.innerHTML=`<b style="color:${color(s.subject)}">${esc(s.subject)}</b><small>${fa(s.startTime)} – ${fa(s.endTime)} · ${esc(s.topic||'بدون مبحث')}</small>`;el.onclick=()=>openEditor(s.id);list.appendChild(el)});wrap.appendChild(card)}document.getElementById('wt').textContent=`${a} تا ${b}`}
function renderMonth(){const grid=document.getElementById('month');grid.innerHTML='';const now=new Date(),[jy,jm]=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());const serial=jy*12+(jm-1)+mo,y=Math.floor(serial/12),m=serial-y*12+1;document.getElementById('mt').textContent=`${MONTHS[m-1]} ${fa(y)}`;document.getElementById('mheads').innerHTML=DAYS.map(x=>`<div>${x}</div>`).join('');const first=j2g(y,m,1);const offset=(new Date(first+'T12:00:00').getDay()+1)%7;for(let i=0;i<offset;i++)grid.appendChild(document.createElement('div'));const cnt=m<=6?31:m<=11?30:((y%4===3)?30:29);for(let day=1;day<=cnt;day++){const ds=j2g(y,m,day),cell=document.createElement('div');cell.className='mday';cell.innerHTML=`<div class="monthtop"><b>${fa(day)}</b><button class="madd">＋ برنامه</button></div>`;cell.querySelector('.madd').onclick=()=>openEditor(null,ds);const ta=document.createElement('textarea');ta.value=notes[ds]||'';ta.placeholder='برنامه این روز را اینجا بنویس...';ta.addEventListener('input',()=>{notes[ds]=ta.value;save()});cell.appendChild(ta);const list=document.createElement('div');sessions.filter(s=>s.date===ds).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')).forEach(s=>{const el=document.createElement('button');el.className='mini';el.innerHTML=`<b style="color:${color(s.subject)}">${esc(s.subject)}</b><small>${fa(s.startTime)} – ${fa(s.endTime)} · ${esc(s.topic||'بدون مبحث')}</small>`;el.onclick=()=>openEditor(s.id);list.appendChild(el)});cell.appendChild(list);grid.appendChild(cell)}}
function metrics(){document.getElementById('kt').textContent=fa(sessions.length);document.getElementById('kd').textContent=fa(sessions.filter(s=>s.date===today()).length);document.getElementById('kp').textContent=fa(sessions.filter(s=>!s.completed&&s.subject!=='استراحت / تفریح').length);document.getElementById('kh').textContent=fa((sessions.reduce((n,s)=>n+minutes(s.startTime,s.endTime),0)/60).toFixed(1))}
function openEditor(id=null,date=null){const existing=id?sessions.find(s=>s.id===id):null;const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><div class="mhead"><h3>${existing?'ویرایش برنامه':'افزودن برنامه جدید'}</h3><button id="cx" class="btn">×</button></div><form class="form"><label>درس / فعالیت<select id="es">${subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label><label>تاریخ<input id="ed" type="date"></label><div class="row2"><label>از<input id="est" type="time"></label><label>تا<input id="eet" type="time"></label></div><label>وضعیت<select id="ex">${STATUS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label><label>مبحث / فصل<textarea id="etop" rows="3" placeholder="مبحث، فصل یا توضیحات"></textarea></label><div class="formfoot"><button type="button" id="del" class="btn danger">حذف</button><div><button type="button" id="cancel" class="btn">انصراف</button><button type="submit" class="btn primary">ذخیره</button></div></div></form></div>`;document.body.appendChild(bg);bg.querySelector('#es').value=existing?.subject||subjects[0]||'';bg.querySelector('#ed').value=existing?.date||date||today();bg.querySelector('#est').value=existing?.startTime||'09:00';bg.querySelector('#eet').value=existing?.endTime||'11:00';bg.querySelector('#ex').value=existing?.status||'برنامه‌ریزی شده';bg.querySelector('#etop').value=existing?.topic||'';bg.querySelector('#del').style.visibility=existing?'visible':'hidden';bg.querySelector('#cx').onclick=()=>bg.remove();bg.querySelector('#cancel').onclick=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)bg.remove()};bg.querySelector('form').onsubmit=e=>{e.preventDefault();const data={id:existing?.id||uid(),subject:bg.querySelector('#es').value,date:bg.querySelector('#ed').value,startTime:bg.querySelector('#est').value,endTime:bg.querySelector('#eet').value,status:bg.querySelector('#ex').value,completed:bg.querySelector('#ex').value==='خوانده شده',topic:bg.querySelector('#etop').value};if(existing)Object.assign(existing,data);else sessions.unshift(data);save();bg.remove();renderAll()};bg.querySelector('#del').onclick=()=>{if(existing){sessions=sessions.filter(s=>s.id!==existing.id);save();bg.remove();renderAll()}}}
function manageSubjects(){const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><div class="mhead"><h3>مدیریت دروس</h3><button id="x" class="btn">×</button></div><div class="form"><div class="row2"><input id="sn" placeholder="نام درس جدید"><button id="addSub" class="btn primary">افزودن درس</button></div><div class="list" id="sl"></div><div class="formfoot"><span></span><button id="close" class="btn">بستن</button></div></div></div>`;document.body.appendChild(bg);const list=bg.querySelector('#sl');const draw=()=>{list.innerHTML=subjects.map((s,i)=>`<div class="subrow"><span>${esc(s)}</span><button class="btn danger" data-i="${i}">حذف</button></div>`).join('');list.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(subjects.length<=1)return;subjects.splice(Number(b.dataset.i),1);sessions=sessions.filter(x=>subjects.includes(x.subject));save();draw();renderAll()})};bg.querySelector('#x').onclick=()=>bg.remove();bg.querySelector('#close').onclick=()=>bg.remove();bg.querySelector('#addSub').onclick=()=>{const n=bg.querySelector('#sn').value.trim();if(n&&!subjects.includes(n)){subjects.push(n);save();bg.querySelector('#sn').value='';draw();renderAll()}};draw()}
window.addEventListener('load',render);
window.addEventListener('beforeunload',save);
</script>
</body></html>
