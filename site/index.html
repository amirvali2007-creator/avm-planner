<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D3D2D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVM Planner"><link rel="manifest" href="./manifest.webmanifest"><title>AVM Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#172033;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:#0d3d2d}.wrap{max-width:1500px;margin:auto;padding:14px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #dfe3e8;background:#fff;border-radius:9px;padding:8px 12px}.primary{background:#0d3d2d;color:#fff;border-color:#0d3d2d}.card{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi small{color:#667085}.kpi b{display:block;font-size:23px;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.head h2{font-size:16px;color:#0d3d2d;margin:0}.tablewrap{overflow:auto}table{width:100%;min-width:1100px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e4e7ec}th{background:#fafafa;color:#667085;font-size:11px}.edit{width:100%;border:1px solid #cfd5dd;border-radius:8px;padding:7px;background:#fff}.topic{min-width:240px}.time{direction:ltr;text-align:center}.monthnav{display:flex;gap:8px;align-items:center}.weekheads,.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekheads div{text-align:center;background:#edf1ef;border-radius:7px;padding:7px;font-size:11px;font-weight:700}.mday{min-height:240px;border:1px solid #e4e7ec;border-radius:10px;background:#fafafa;padding:7px}.mdate{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#0d3d2d}.daynote{width:100%;min-height:100px;margin-top:7px;border:1px solid #cfd5dd;border-radius:8px;padding:7px;background:#fff;resize:vertical}.session{display:flex;gap:5px;margin-top:5px}.session button{flex:1;border:1px solid #e4e7ec;background:#fff;border-radius:7px;padding:6px;text-align:right;font-size:11px}.add{border:0;background:#0d3d2d;color:#fff;border-radius:7px;padding:5px 8px}.modalbg{position:fixed;inset:0;background:#11182799;display:grid;place-items:center;padding:15px;z-index:100}.modal{background:#fff;border-radius:15px;width:min(650px,100%);max-height:90vh;overflow:auto}.mhead{display:flex;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #e4e7ec}.form{display:grid;gap:10px;padding:15px}.form label{display:grid;gap:5px;font-weight:700;font-size:12px}.form input,.form select,.form textarea{border:1px solid #cfd5dd;border-radius:8px;padding:8px;background:#fff}.actions{display:flex;gap:8px;padding:0 15px 15px}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.monthgrid,.weekheads{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.monthgrid,.weekheads{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">🎓 پلنر تحصیلی AVM</div><div class="tools"><button class="btn" id="subjectsBtn">مدیریت دروس</button><button class="btn primary" id="newBtn">＋ برنامه جدید</button></div></header><main class="wrap"><section class="grid"><div class="card kpi"><small>کل برنامه‌ها</small><b id="total">۰</b></div><div class="card kpi"><small>ساعات برنامه‌ریزی‌شده</small><b id="hours">۰</b></div><div class="card kpi"><small>برنامه امروز</small><b id="today">۰</b></div><div class="card kpi"><small>انجام‌نشده</small><b id="remaining">۰</b></div></section><section class="card"><div class="head"><h2>جدول روزانه — کاملاً قابل ویرایش</h2><div class="tools"><select id="filter"></select><input id="search" placeholder="جستجو"></div></div><div class="tablewrap"><table><thead><tr><th>انجام</th><th>درس</th><th>تاریخ</th><th>شروع</th><th>پایان</th><th>وضعیت</th><th>مبحث / فصل</th><th>حذف</th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="card"><div class="head"><h2>برنامه ماهانه — همه روزها قابل ویرایش</h2><div class="monthnav"><button class="btn" id="prev">ماه قبل</button><b id="monthTitle"></b><button class="btn" id="next">ماه بعد</button></div></div><div id="heads" class="weekheads"></div><div id="month" class="monthgrid"></div></section></main><div id="modal" class="hidden"></div><script>'use strict';const SKEY='avm_v11_sessions',SUBKEY='avm_v11_subjects',NKEY='avm_v11_notes',DEFAULT=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'],STATUS=['برنامه‌ریزی شده','در حال مطالعه','خوانده شده','خوانده نشده'],MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];let subjects=load(SUBKEY,DEFAULT.slice()),sessions=load(SKEY,[]),notes=load(NKEY,{}),monthOffset=0;function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(e){return f}}function save(){localStorage.setItem(SKEY,JSON.stringify(sessions));localStorage.setItem(SUBKEY,JSON.stringify(subjects));localStorage.setItem(NKEY,JSON.stringify(notes))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fa(v){return String(v??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function uid(){return crypto?.randomUUID?.()||String(Date.now()+Math.random())}function todayISO(){return new Date().toISOString().slice(0,10)}function g2j(gy,gm,gd){let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const a=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy;let d=365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)-80+gd+a[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;jy+=Math.floor((d-1)/365);if(d>0)d=(d-1)%365;return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}function j2g(jy,jm,jd){jy-=979;let d=365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+78+jd;d+=jm<7?(jm-1)*31:(jm-7)*30+186;let gy=1600+400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1,md=[0,31,28,31,30,31,30,31,31,30,31,30,31];md[2]=gy%4===0&&gy%100!==0||gy%400===0?29:28;let gm=1;while(gm<=12&&gd>md[gm]){gd-=md[gm];gm++}return`${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}function month(){const n=new Date(),[jy,jm]=g2j(n.getFullYear(),n.getMonth()+1,n.getDate()),z=jy*12+jm-1+monthOffset;return[Math.floor(z/12),z%12+1]}function render(){renderFilter();renderTable();renderMonth();renderStats()}function renderFilter(){const f=document.getElementById('filter'),old=f.value;f.innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(subjects.includes(old))f.value=old}function renderTable(){const f=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase(),list=sessions.filter(s=>(!f||s.subject===f)&&(`${s.subject} ${s.topic||''}`).toLowerCase().includes(q)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||'')),body=document.getElementById('tbody');body.innerHTML=list.map(s=>`<tr><td><input type="checkbox" data-done="${s.id}" ${s.done?'checked':''}></td><td><select class="edit" data-id="${s.id}" data-field="subject">${subjects.map(x=>`<option value="${esc(x)}" ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit" data-id="${s.id}" data-field="date" type="date" value="${esc(s.date)}"></td><td><input class="edit time" data-id="${s.id}" data-field="start" type="time" value="${esc(s.start)}"></td><td><input class="edit time" data-id="${s.id}" data-field="end" type="time" value="${esc(s.end)}"></td><td><select class="edit" data-id="${s.id}" data-field="status">${STATUS.map(x=>`<option value="${esc(x)}" ${x===s.status?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit topic" data-id="${s.id}" data-field="topic" value="${esc(s.topic||'')}" placeholder="مبحث / فصل"></td><td><button class="btn" data-del="${s.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:25px">برنامه‌ای ثبت نشده است.</td></tr>';body.querySelectorAll('[data-field]').forEach(e=>e.onchange=()=>{const s=sessions.find(x=>x.id===e.dataset.id);if(!s)return;s[e.dataset.field]=e.value;if(e.dataset.field==='status')s.done=e.value==='خوانده شده';save();render()});body.querySelectorAll('[data-done]').forEach(e=>e.onchange=()=>{const s=sessions.find(x=>x.id===e.dataset.done);if(!s)return;s.done=e.checked;s.status=e.checked?'خوانده شده':'برنامه‌ریزی شده';save();render()});body.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{sessions=sessions.filter(x=>x.id!==e.dataset.del);save();render()})}function renderMonth(){const[jy,jm]=month();document.getElementById('monthTitle').textContent=`${MONTHS[jm-1]} ${fa(jy)}`;document.getElementById('heads').innerHTML=DAYS.map(x=>`<div>${x}</div>`).join('');const grid=document.getElementById('month');grid.innerHTML='';const first=j2g(jy,jm,1),fd=new Date(first+'T12:00:00'),off=(fd.getDay()+1)%7,days=jm<=6?31:jm<=11?30:(jy%4===3?30:29);for(let i=0;i<off;i++)grid.appendChild(document.createElement('div'));for(let day=1;day<=days;day++){const ds=j2g(jy,jm,day),c=document.createElement('div');c.className='mday';c.innerHTML=`<div class="mdate"><span>${fa(day)}</span><button class="add" data-date="${ds}">＋ برنامه</button></div><textarea class="daynote" data-note="${ds}" placeholder="برنامه این روز را بنویس...">${esc(notes[ds]||'')}</textarea><div class="sessions"></div>`;c.querySelector('[data-note]').oninput=e=>{notes[ds]=e.target.value;save()};c.querySelector('[data-date]').onclick=()=>editor(null,ds);sessions.filter(s=>s.date===ds).forEach(s=>{const row=document.createElement('div');row.className='session';const b=document.createElement('button');b.innerHTML=`${esc(s.subject)} · ${fa(s.start)}–${fa(s.end)}<br>${esc(s.topic||'بدون مبحث')}`;b.onclick=()=>editor(s.id);row.appendChild(b);c.querySelector('.sessions').appendChild(row)});grid.appendChild(c)}while(grid.children.length%7)grid.appendChild(document.createElement('div'))}function renderStats(){document.getElementById('total').textContent=fa(sessions.length);document.getElementById('today').textContent=fa(sessions.filter(s=>s.date===todayISO()).length);document.getElementById('remaining').textContent=fa(sessions.filter(s=>!s.done).length);let m=0;sessions.forEach(s=>{if(s.start&&s.end){const[a,b]=s.start.split(':').map(Number),[c,d]=s.end.split(':').map(Number),n=c*60+d-a*60-b;if(n>0)m+=n}});document.getElementById('hours').textContent=fa((m/60).toFixed(1))+' ساعت'}function modal(html){const m=document.getElementById('modal');m.className='modalbg';m.innerHTML=`<div class="modal">${html}</div>`}function close(){const m=document.getElementById('modal');m.className='hidden';m.innerHTML=''}function editor(editId,date){const old=editId?sessions.find(x=>x.id===editId):null,s=old?{...old}:{id:uid(),subject:subjects[0]||'',date:date||todayISO(),start:'08:00',end:'09:00',status:'برنامه‌ریزی شده',topic:'',done:false};modal(`<div class="mhead"><b>${old?'ویرایش برنامه':'برنامه جدید'}</b><button class="btn" id="x">بستن</button></div><div class="form"><label>درس<select id="esub">${subjects.map(x=>`<option value="${esc(x)}" ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>تاریخ<input id="edate" type="date" value="${esc(s.date)}"></label><label>زمان شروع<input id="estart" type="time" value="${esc(s.start)}"></label><label>زمان پایان<input id="eend" type="time" value="${esc(s.end)}"></label><label>وضعیت<select id="estatus">${STATUS.map(x=>`<option value="${esc(x)}" ${x===s.status?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>مبحث / فصل<textarea id="etopic" rows="4">${esc(s.topic||'')}</textarea></label></div><div class="actions"><button class="btn primary" id="save">ذخیره</button><button class="btn" id="cancel">انصراف</button></div>`);document.getElementById('x').onclick=close;document.getElementById('cancel').onclick=close;document.getElementById('save').onclick=()=>{s.subject=document.getElementById('esub').value;s.date=document.getElementById('edate').value;s.start=document.getElementById('estart').value;s.end=document.getElementById('eend').value;s.status=document.getElementById('estatus').value;s.topic=document.getElementById('etopic').value;s.done=s.status==='خوانده شده';if(old)sessions[sessions.findIndex(x=>x.id===s.id)]=s;else sessions.push(s);save();close();render()}}function subjectManager(){modal(`<div class="mhead"><b>مدیریت دروس</b><button class="btn" id="sx">بستن</button></div><div class="form"><div class="tools"><input id="newsub" placeholder="نام درس جدید"><button class="btn primary" id="addsub">افزودن</button></div>${subjects.map((x,i)=>`<div class="tools"><input data-si="${i}" value="${esc(x)}"><button class="btn" data-ri="${i}">حذف</button></div>`).join('')}</div>`);document.getElementById('sx').onclick=close;document.getElementById('addsub').onclick=()=>{const x=document.getElementById('newsub').value.trim();if(x&&!subjects.includes(x)){subjects.push(x);save();subjectManager();render()}};document.querySelectorAll('[data-si]').forEach(e=>e.onchange=()=>{const i=+e.dataset.si,v=e.value.trim(),old=subjects[i];if(v&&(!subjects.includes(v)||v===old)){subjects[i]=v;sessions.forEach(s=>{if(s.subject===old)s.subject=v});save();subjectManager();render()}});document.querySelectorAll('[data-ri]').forEach(e=>e.onclick=()=>{if(subjects.length>1){subjects.splice(+e.dataset.ri,1);save();subjectManager();render()}})}document.getElementById('newBtn').onclick=()=>editor(null);document.getElementById('subjectsBtn').onclick=subjectManager;document.getElementById('filter').onchange=renderTable;document.getElementById('search').oninput=renderTable;document.getElementById('prev').onclick=()=>{monthOffset--;renderMonth()};document.getElementById('next').onclick=()=>{monthOffset++;renderMonth()};render();</script></body></html>
