    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22AVM%20Planner%22%2C%22short_name%22%3A%22AVM%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f7f5ef%22%2C%22theme_color%22%3A%22%234f46e5%22%7D">
    <script>
      // Kill any previously installed planner service worker/cache so this FINAL build cannot be shadowed by an older deployment.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
        if (window.caches) caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
    </script>
