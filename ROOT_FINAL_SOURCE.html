<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVM Planner">
<meta name="mobile-web-app-capable" content="yes">
<title>AVM Planner — قابل ویرایش</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5ef;color:#172033}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #e4e7ec;background:#f4f5f7;border-radius:10px;padding:8px 12px;cursor:pointer}.primary{background:#4f46e5;color:#fff}.wrap{max-width:1450px;margin:auto;padding:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.kpi{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 4px 18px #00000008}.kpi{padding:14px}.kpi span,.kpi small{display:block;color:#667085;font-size:10px}.kpi b{display:block;font-size:23px;margin:4px 0}.card{padding:14px;margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tools input,.tools select{border:1px solid #e4e7ec;border-radius:9px;padding:7px;background:#fff;font-size:11px}.tablewrap{overflow:auto}table{width:100%;min-width:980px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e4e7ec;text-align:right;vertical-align:middle}th{font-size:10px;color:#667085;background:#fafafa}.edit{width:100%;padding:7px 8px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:11px}.topic{min-width:220px}.time{width:92px;direction:ltr}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:1px solid #e4e7ec;border-radius:12px;padding:8px;min-height:190px;background:#fafafa}.daytop,.monthtop{display:flex;justify-content:space-between;align-items:center}.daytop button,.madd{border:0;background:#4f46e5;color:#fff;border-radius:7px;padding:4px 7px;font-size:9px;cursor:pointer}.mini{width:100%;text-align:right;border:1px solid #e4e7ec;border-radius:8px;background:#fff;padding:6px;margin-top:5px;cursor:pointer}.mini b,.mini small{display:block}.mini small{font-size:9px;color:#667085;margin-top:2px}.monthheads,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.monthheads>div{background:#f4f5f7;padding:7px;text-align:center;border-radius:7px;font-size:10px;color:#667085;font-weight:700}.mday{min-height:245px;border:1px solid #e4e7ec;border-radius:10px;background:#fafafa;padding:7px}.mday textarea.daynote{width:100%;min-height:95px;resize:vertical;border:1px solid #d1d5db;border-radius:8px;padding:6px;background:#fff;font-size:10px}.modalbg{position:fixed;inset:0;z-index:99;background:#111827aa;display:grid;place-items:center;padding:14px}.modal{width:min(640px,100%);background:#fff;border-radius:16px;overflow:hidden}.mhead{padding:12px 14px;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between}.form{padding:14px;display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:11px;font-weight:700}.form input,.form select,.form textarea{border:1px solid #d1d5db;border-radius:9px;padding:8px;font-size:11px}@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr 1fr}.month{grid-template-columns:repeat(2,1fr)}.monthheads{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.week,.month,.monthheads{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}</style>
</head><body><div id="app"></div>
<script>
'use strict';
(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}})();
const K={s:'avm_sessions_v6',sub:'avm_subjects_v6',n:'avm_month_notes_v6'},DEFAULT=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'],STATUS=['برنامه‌ریزی شده','در حال مطالعه','خوانده شده','خوانده نشده'],DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'],MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
let subjects=load(K.sub,DEFAULT.slice()),sessions=load(K.s,[]),notes=load(K.n,{}),mo=0,wo=0;
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){localStorage.setItem(K.s,JSON.stringify(sessions));localStorage.setItem(K.sub,JSON.stringify(subjects));localStorage.setItem(K.n,JSON.stringify(notes))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fa(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function pad(n){return String(n).padStart(2,'0')}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function today(){return new Date().toISOString().slice(0,10)}
function g2j(gy,gm,gd){const a=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;let gy2=gm>2?gy+1:gy,d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+a[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;jy+=Math.floor((d-1)/365);if(d>0)d=(d-1)%365;return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}function j2g(jy,jm,jd){jy-=979;let d=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd;d+=jm<7?(jm-1)*31:(jm-7)*30+186;let gy=1600+400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1,md=[0,31,28,31,30,31,30,31,31,30,31,30,31];md[2]=(gy%4===0&&gy%100!==0)||gy%400===0?29:28;let gm=1;while(gm<=12&&gd>md[gm]){gd-=md[gm];gm++}return`${gy}-${pad(gm)}-${pad(gd)}`}function jf(ds){const[y,m,d]=ds.split('-').map(Number),[jy,jm,jd]=g2j(y,m,d);return`${fa(jy)}/${fa(pad(jm))}/${fa(pad(jd))}`}
function render(){document.getElementById('app').innerHTML=`<header class="top"><div><b>🎓 پلنر تحصیلی AVM</b></div><div class="tools"><button id="subjects" class="btn">مدیریت دروس</button><button id="new" class="btn primary">＋ برنامه جدید</button></div></header><main class="wrap"><section class="grid4"><div class="kpi"><span>کل برنامه‌ها</span><b id="kt">۰</b></div><div class="kpi"><span>ساعات برنامه‌ریزی‌شده</span><b id="kh">۰</b></div><div class="kpi"><span>برنامه امروز</span><b id="kd">۰</b></div><div class="kpi"><span>باقی‌مانده</span><b id="kp">۰</b></div></section><section class="card"><div class="head"><h2>جدول روزانه — همه ستون‌ها قابل ویرایش</h2><div class="tools"><select id="filter"></select><input id="search" placeholder="جستجو..."></div></div><div class="tablewrap"><table><thead><tr><th>انجام</th><th>درس</th><th>تاریخ</th><th>از</th><th>تا</th><th>وضعیت</th><th>مبحث / فصل</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section><section class="card"><div class="head"><h2>تقویم هفتگی</h2><div class="tools"><button id="wp" class="btn">هفته قبل</button><span id="wt"></span><button id="wn" class="btn">هفته بعد</button></div></div><div id="week" class="week"></div></section><section class="card"><div class="head"><h2>برنامه ماهانه — هر روز قابل ویرایش</h2><div class="tools"><button id="mp" class="btn">ماه قبل</button><span id="mt"></span><button id="mn" class="btn">ماه بعد</button></div></div><div id="mh" class="monthheads"></div><div id="month" class="month"></div></section></main>`;document.getElementById('new').onclick=()=>editor(null);document.getElementById('subjects').onclick=subjectManager;document.getElementById('filter').onchange=table;document.getElementById('search').oninput=table;document.getElementById('wp').onclick=()=>{wo--;week()};document.getElementById('wn').onclick=()=>{wo++;week()};document.getElementById('mp').onclick=()=>{mo--;month()};document.getElementById('mn').onclick=()=>{mo++;month()};all()}
function all(){filter();table();week();month();metrics()}function filter(){const s=document.getElementById('filter'),v=s.value;s.innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(subjects.includes(v))s.value=v}
function table(){const body=document.getElementById('tb'),f=document.getElementById('filter').value,q=document.getElementById('search').value.trim().toLowerCase();let list=sessions.filter(s=>(!f||s.subject===f)&&(`${s.subject} ${s.topic||''}`.toLowerCase().includes(q)));body.innerHTML=list.map(s=>`<tr><td><input type="checkbox" data-done="${s.id}" ${s.completed?'checked':''}></td><td><select class="edit" data-field="subject" data-id="${s.id}">${subjects.map(x=>`<option value="${esc(x)}" ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit" data-field="date" data-id="${s.id}" type="date" value="${esc(s.date||'')}"></td><td><input class="edit time" data-field="startTime" data-id="${s.id}" type="time" value="${esc(s.startTime||'')}"></td><td><input class="edit time" data-field="endTime" data-id="${s.id}" type="time" value="${esc(s.endTime||'')}"></td><td><select class="edit" data-field="status" data-id="${s.id}">${STATUS.map(x=>`<option value="${esc(x)}" ${x===s.status?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input class="edit topic" data-field="topic" data-id="${s.id}" value="${esc(s.topic||'')}" placeholder="مبحث / فصل"></td></tr>`).join('');body.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{const s=sessions.find(x=>x.id===el.dataset.id);if(!s)return;s[el.dataset.field]=el.value;if(el.dataset.field==='status')s.completed=el.value==='خوانده شده';save();all()}));body.querySelectorAll('[data-done]').forEach(el=>el.addEventListener('change',()=>{const s=sessions.find(x=>x.id===el.dataset.done);if(!s)return;s.completed=el.checked;s.status=el.checked?'خوانده شده':'برنامه‌ریزی شده';save();all()}))}
function week(){const wrap=document.getElementById('week');wrap.innerHTML='';const base=new Date();base.setDate(base.getDate()-((base.getDay()+1)%7)+wo*7);for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const ds=d.toISOString().slice(0,10),card=document.createElement('div');card.className='day';card.innerHTML=`<div class="daytop"><div><b>${DAYS[i]}</b><span>${jf(ds)}</span></div><button>＋</button></div><div></div>`;card.querySelector('button').onclick=()=>editor(null,ds);const list=card.lastElementChild;sessions.filter(s=>s.date===ds).forEach(s=>{const el=document.createElement('button');el.className='mini';el.innerHTML=`<b>${esc(s.subject)}</b><small>${fa(s.startTime||'')} – ${fa(s.endTime||'')} · ${esc(s.topic||'بدون مبحث')}</small>`;el.onclick=()=>editor(s.id);list.appendChild(el)});wrap.appendChild(card)}}
function month(){const grid=document.getElementById('month');grid.innerHTML='';const now=new Date(),[jy,jm]=g2j(now.getFullYear(),now.getMonth()+1,now.getDate()),serial=jy*12+(jm-1)+mo,y=Math.floor(serial/12),m=serial-y*12+1;document.getElementById('mt').textContent=`${MONTHS[m-1]} ${fa(y)}`;document.getElementById('mh').innerHTML=DAYS.map(x=>`<div>${x}</div>`).join('');const first=j2g(y,m,1),off=(new Date(first+'T12:00:00').getDay()+1)%7;for(let i=0;i<off;i++)grid.appendChild(document.createElement('div'));const cnt=m<=6?31:m<=11?30:((y%4===3)?30:29);for(let day=1;day<=cnt;day++){const ds=j2g(y,m,day),cell=document.createElement('div');cell.className='mday';cell.innerHTML=`<div class="monthtop"><b>${fa(day)}</b><button class="madd">＋ برنامه</button></div>`;cell.querySelector('.madd').onclick=()=>editor(null,ds);const ta=document.createElement('textarea');ta.className='daynote';ta.value=notes[ds]||'';ta.placeholder='برنامه این روز را اینجا بنویس...';ta.oninput=()=>{notes[ds]=ta.value;save()};cell.appendChild(ta);const list=document.createElement('div');sessions.filter(s=>s.date===ds).forEach(s=>{const el=document.createElement('button');el.className='mini';el.innerHTML=`<b>${esc(s.subject)}</b><small>${fa(s.startTime||'')} – ${fa(s.endTime||'')} · ${esc(s.topic||'بدون مبحث')}</small>`;el.onclick=()=>editor(s.id);list.appendChild(el)});cell.appendChild(list);grid.appendChild(cell)}}
function metrics(){document.getElementById('kt').textContent=fa(sessions.length);document.getElementById('kd').textContent=fa(sessions.filter(s=>s.date===today()).length);document.getElementById('kp').textContent=fa(sessions.filter(s=>!s.completed).length);document.getElementById('kh').textContent=fa((sessions.reduce((n,s)=>n+minutes(s.startTime,s.endTime),0)/60).toFixed(1))}function minutes(a,b){if(!a||!b)return 0;const A=a.split(':').map(Number),B=b.split(':').map(Number);return Math.max(0,B[0]*60+B[1]-A[0]*60-A[1])}
function editor(id,date){const e=id?sessions.find(s=>s.id===id):null,b=document.createElement('div');b.className='modalbg';b.innerHTML=`<div class="modal"><div class="mhead"><h3>${e?'ویرایش برنامه':'افزودن برنامه جدید'}</h3><button id="cx" class="btn">×</button></div><form class="form"><label>درس / فعالیت<select id="es">${subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label><label>تاریخ<input id="ed" type="date"></label><div><label>از<input id="est" type="time"></label><label>تا<input id="eet" type="time"></label></div><label>وضعیت<select id="ex">${STATUS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label><label>مبحث / فصل<textarea id="etop" rows="3"></textarea></label><div><button type="button" id="cancel" class="btn">انصراف</button><button type="submit" class="btn primary">ذخیره</button></div></form></div>`;document.body.appendChild(b);b.querySelector('#es').value=e?.subject||subjects[0]||'';b.querySelector('#ed').value=e?.date||date||today();b.querySelector('#est').value=e?.startTime||'09:00';b.querySelector('#eet').value=e?.endTime||'11:00';b.querySelector('#ex').value=e?.status||'برنامه‌ریزی شده';b.querySelector('#etop').value=e?.topic||'';b.querySelector('#cx').onclick=()=>b.remove();b.querySelector('#cancel').onclick=()=>b.remove();b.querySelector('form').onsubmit=x=>{x.preventDefault();const d={id:e?.id||uid(),subject:b.querySelector('#es').value,date:b.querySelector('#ed').value,startTime:b.querySelector('#est').value,endTime:b.querySelector('#eet').value,status:b.querySelector('#ex').value,completed:b.querySelector('#ex').value==='خوانده شده',topic:b.querySelector('#etop').value};if(e)Object.assign(e,d);else sessions.unshift(d);save();b.remove();all()}}
function subjectManager(){const b=document.createElement('div');b.className='modalbg';b.innerHTML=`<div class="modal"><div class="mhead"><h3>مدیریت دروس</h3><button id="x" class="btn">×</button></div><div class="form"><div><input id="sn" placeholder="نام درس جدید"><button id="addSub" class="btn primary">افزودن درس</button></div><div id="sl"></div><button id="close" class="btn">بستن</button></div></div>`;document.body.appendChild(b);const list=b.querySelector('#sl');const draw=()=>{list.innerHTML=subjects.map((s,i)=>`<div><span>${esc(s)}</span><button class="btn" data-i="${i}">حذف</button></div>`).join('');list.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{if(subjects.length<=1)return;subjects.splice(+x.dataset.i,1);save();draw();all()})};b.querySelector('#x').onclick=()=>b.remove();b.querySelector('#close').onclick=()=>b.remove();b.querySelector('#addSub').onclick=()=>{const n=b.querySelector('#sn').value.trim();if(n&&!subjects.includes(n)){subjects.push(n);save();b.querySelector('#sn').value='';draw();all()}};draw()}
window.addEventListener('load',render);window.addEventListener('beforeunload',save);
</script></body></html>
