<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVM Planner"><meta name="mobile-web-app-capable" content="yes"><title>AVM Planner</title></head><body><div id="app"></div><script>const K={s:'avm_sessions_v7',sub:'avm_subjects_v7',n:'avm_notes_v7'},S=['تغذیه','فیزیولوژی','بیوشیمی','زبان','استراحت / تفریح'];let subjects=JSON.parse(localStorage.getItem(K.sub)||'null')||S.slice(),sessions=JSON.parse(localStorage.getItem(K.s)||'[]'),notes=JSON.parse(localStorage.getItem(K.n)||'{}');function save(){localStorage.setItem(K.s,JSON.stringify(sessions));localStorage.setItem(K.sub,JSON.stringify(subjects));localStorage.setItem(K.n,JSON.stringify(notes))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function render(){document.getElementById('app').innerHTML='<h1>AVM Planner</h1><button id="new">برنامه جدید</button><table><tbody id="tb"></tbody></table><div id="month"></div>';document.getElementById('new').onclick=()=>editor();table();month()}function table(){tb.innerHTML=sessions.map(s=>`<tr><td><select data-id="${s.id}" data-f="subject">${subjects.map(x=>`<option ${x===s.subject?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><input type="date" data-id="${s.id}" data-f="date" value="${s.date||''}"></td><td><input type="time" data-id="${s.id}" data-f="startTime" value="${s.startTime||''}"></td><td><input type="time" data-id="${s.id}" data-f="endTime" value="${s.endTime||''}"></td><td><input data-id="${s.id}" data-f="topic" value="${esc(s.topic||'')}"></td></tr>`).join('');document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{let s=sessions.find(x=>x.id===e.dataset.id);s[e.dataset.f]=e.value;save();table()})}function editor(){const b=document.createElement('div');b.innerHTML=`<div><select id="es">${subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="ed" type="date" value="${today()}"><input id="st" type="time" value="09:00"><input id="et" type="time" value="11:00"><textarea id="tp"></textarea><button id="ok">ذخیره</button></div>`;document.body.appendChild(b);ok.onclick=()=>{sessions.push({id:Date.now().toString(),subject:es.value,date:ed.value,startTime:st.value,endTime:et.value,topic:tp.value,completed:false});save();b.remove();table();month()}}function month(){monthEl=document.getElementById('month');monthEl.innerHTML='';for(let i=1;i<=31;i++){let d=document.createElement('div');d.innerHTML=`<b>${i}</b><textarea data-day="${i}">${esc(notes[i]||'')}</textarea><button data-add="${i}">＋</button>`;d.querySelector('textarea').oninput=e=>{notes[i]=e.target.value;save()};d.querySelector('button').onclick=()=>editor();monthEl.appendChild(d)}}window.addEventListener('load',render);</script></body></html>
